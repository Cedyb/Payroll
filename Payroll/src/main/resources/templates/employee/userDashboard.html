<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <nav class="col-md-2 p-0" th:replace="fragments/userNav :: nav"></nav>

        <!-- Main Content -->
        <main class="col-md-10 ms-sm-auto px-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 th:text="'Welcome, ' + ${employee.fullName}">Welcome, Employee</h4>
            </div>

            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <h2>Record Attendance</h2>

            <!-- Clock In Form -->
            <form method="post" action="/userAttendance/attendance" class="mb-3">
                <input type="hidden" name="type" value="in" />
                <input type="hidden" name="employeeId" th:value="${employee.employeeId}" />

                <label for="datetime-in" class="form-label">Clock In Date & Time:</label>
                <input type="datetime-local" id="datetime-in" name="dateTime" class="form-control" required />
                <button type="submit" class="btn btn-success mt-2">Clock In</button>
            </form>

            <!-- Clock Out Form -->
            <form method="post" action="/userAttendance/attendance">
                <input type="hidden" name="type" value="out" />
                <input type="hidden" name="employeeId" th:value="${employee.employeeId}" />

                <label for="datetime-out" class="form-label">Clock Out Date & Time:</label>
                <input type="datetime-local" id="datetime-out" name="dateTime" class="form-control" required />
                <button type="submit" class="btn btn-danger mt-2">Clock Out</button>
            </form>

            <div class="mt-4">
                <a href="/userAttendance" class="btn btn-primary">View Attendance Summary</a>
            </div>
        </main>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const forms = document.querySelectorAll('form');

        forms.forEach(form => {
            form.addEventListener('submit', () => {
                const button = form.querySelector('button[type="submit"]');
                if (button) {
                    button.disabled = true;
                    button.innerText = 'Submitting...';
                }
            });
        });
    });
</script>
</body>
</html>
