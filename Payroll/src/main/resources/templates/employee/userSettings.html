<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>User Settings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container-fluid">
  <div class="row">

    <nav class="col-md-2 p-0" th:replace="fragments/userNav :: nav"></nav>

    <main class="col-md-10 ms-sm-auto px-4 py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h4 th:text="'Welcome, ' + ${employee.fullName}">Welcome, User</h4>
        </div>
      </div>

      <p>This is your Settings page. You can update your profile, change your password, and manage your account preferences.</p>

      <div class="card mt-4" style="max-width: 600px;">
        <div class="card-body">
          <h5 class="card-title">Change Password</h5>

          <form th:action="@{/userSettings/changePassword}" method="post">
            <div class="mb-3">
              <label for="currentPassword" class="form-label">Current Password</label>
              <input type="password" class="form-control" id="currentPassword" name="currentPassword" required>
            </div>

            <div class="mb-3">
              <label for="newPassword" class="form-label">New Password</label>
              <input type="password" class="form-control" id="newPassword" name="newPassword" required>
            </div>

            <div class="mb-3">
              <label for="confirmPassword" class="form-label">Confirm New Password</label>
              <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
            </div>

            <div th:if="${message}" class="mb-3">
              <p th:text="${message}" th:classappend="${message.contains('success') ? 'text-success' : 'text-danger'}"></p>
            </div>

            <button type="submit" class="btn btn-primary">Change Password</button>
          </form>
        </div>
      </div>

    </main>
  </div>
</div>
</body>
</html>
