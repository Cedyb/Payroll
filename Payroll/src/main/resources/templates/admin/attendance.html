<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Attendance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar (left) -->
    <div class="col-md-2 bg-light" th:replace="fragments/nav :: nav"></div>

    <!-- Main Content (right) -->
    <div class="col-md-10 mt-4">
      <h2>Attendance Records</h2>

      <table class="table table-bordered mt-3">
        <thead>
        <tr>
          <th>Employee</th>
          <th>Date</th>
          <th>Morning In</th>
          <th>Morning Out</th>
          <th>Afternoon In</th>
          <th>Afternoon Out</th>
          <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="att : ${attendanceList}">
          <td th:text="${att.employee.firstName + ' ' + att.employee.lastName}">Name</td>
          <td th:text="${att.date}">2025-07-18</td>
          <td th:text="${att.morningTimeIn}">--</td>
          <td th:text="${att.morningTimeOut}">--</td>
          <td th:text="${att.afternoonTimeIn}">--</td>
          <td th:text="${att.afternoonTimeOut}">--</td>
          <td th:text="${att.status}">present</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
