<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Attendance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar (left) -->
    <div class="col-md-2 bg-light" th:replace="fragments/nav :: nav"></div>

    <!-- Main Content (right) -->
    <div class="col-md-10 mt-4">
      <h2>Attendance Records</h2>

      <form method="get" th:action="@{/attendance}" class="mb-3">
        <div class="input-group" style="max-width: 300px;">
          <input type="date" class="form-control" name="date"
                 th:value="${selectedDate}"
                 th:attr="max=${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}">
          <button class="btn btn-primary" type="submit">Filter</button>
        </div>
      </form>

      <table class="table table-bordered mt-3">
        <thead>
        <tr>
          <th>Employee</th>
          <th>Date</th>
          <th>Morning In</th>
          <th>Morning Out</th>
          <th>Afternoon In</th>
          <th>Afternoon Out</th>
          <th>OT In</th> <!-- New -->
          <th>OT Out</th> <!-- New -->
          <th>Regular Hours</th>
          <th>OT Hours</th> <!-- Moved before Total Hours -->
          <th>Total Hours</th>
          <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="att : ${attendanceList}">
          <td th:text="${att.employee?.firstName + ' ' + att.employee?.lastName}"></td>
          <td th:text="${att.date}"></td>
          <td th:text="${att.morningIn != null ? att.morningIn : '--'}"></td>
          <td th:text="${att.morningOut != null ? att.morningOut : '--'}"></td>
          <td th:text="${att.afternoonIn != null ? att.afternoonIn : '--'}"></td>
          <td th:text="${att.afternoonOut != null ? att.afternoonOut : '--'}"></td>
          <td th:text="${att.otIn != null ? att.otIn : '--'}"></td> <!-- New -->
          <td th:text="${att.otOut != null ? att.otOut : '--'}"></td> <!-- New -->
          <td th:text="${att.regularHours != null ? #numbers.formatDecimal(att.regularHours, 1, 2) : '0.00'}"></td>
          <td th:text="${att.overtimeHours != null ? #numbers.formatDecimal(att.overtimeHours, 1, 2) : '0.00'}"></td>
          <td th:text="${att.totalHours != null ? #numbers.formatDecimal(att.totalHours, 1, 2) : '0.00'}"></td>
          <td th:text="${att.status}"></td>
        </tr>
        </tbody>
      </table>

    </div>
  </div>
</div>
</body>
</html>
