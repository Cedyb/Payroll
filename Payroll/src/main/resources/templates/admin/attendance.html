<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Upload Attendance CSV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container-fluid">
  <div class="row">

    <!-- Left nav bar -->
    <nav th:replace="fragments/nav :: nav"></nav>

    <!-- Main content -->
    <main class="col-md-10 p-4">
      <h2>Upload Attendance CSV</h2>

      <!-- Upload form -->
      <form method="POST" action="/attendance/upload" enctype="multipart/form-data" class="mb-4">
        <input type="file" name="file" accept=".csv,.xls,.xlsx" required />
        <button type="submit" class="btn btn-primary">Upload</button>
      </form>

      <!-- Upload message -->
      <p class="fw-bold"
         th:if="${message}"
         th:text="${message}"
         th:classappend="${message.contains('Failed')} ? 'text-danger' : 'text-success'"></p>

      <!-- Attendance table -->
      <table class="table table-bordered table-striped">
        <thead>
        <tr>
          <th>Employee ID</th>
          <th>Employee Name</th>
          <th>Morning In</th>
          <th>Morning Out</th>
          <th>Afternoon In</th>
          <th>Afternoon Out</th>
          <th>Regular Hours</th>
          <th>OT Hours</th>
          <th>Total Hours</th>
          <th>Log Data</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="summary : ${summaries}">
          <td th:text="${summary.employeeId}"></td>
          <td th:text="${summary.employeeName}"></td>
          <td th:text="${summary.morningIn}"></td>
          <td th:text="${summary.morningOut}"></td>
          <td th:text="${summary.afternoonIn}"></td>
          <td th:text="${summary.afternoonOut}"></td>
          <td th:text="${summary.regularHours}"></td>
          <td th:text="${summary.overtimeHours}"></td>
          <td th:text="${summary.totalHours}"></td>
          <td th:text="${summary.logDate}"></td>

        </tr>
        </tbody>
      </table>
    </main>

  </div>
</div>
</body>
</html>
