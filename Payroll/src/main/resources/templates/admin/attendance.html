<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/attendance.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<nav class="sidebar" th:replace="~{fragments/nav :: nav}"></nav>

<main>
    <h2>Attendance</h2>

    <!-- Week Navigation + Upload Button on same row -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <!-- Week Navigation -->
        <div>
            <a th:href="@{/attendance(week=${weekOffset-1})}" class="btn btn-outline-primary">&lt; Previous Week</a>
            <span class="mx-3 fw-bold"
                  th:text="'Week: ' + ${#temporals.format(weekStart, 'yyyy - MMM - dd')} + ' - ' + ${#temporals.format(weekEnd, 'yyyy - MMM - dd')}">
            </span>
            <a th:href="@{/attendance(week=${weekOffset+1})}" class="btn btn-outline-primary">Next Week &gt;</a>
        </div>

        <!-- Upload Button -->
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#uploadModal">
            Upload
        </button>
    </div>

    <!-- Success/Error Message -->
    <p class="fw-bold"
       th:if="${message}"
       th:text="${message}"
       th:classappend="${message.contains('Failed')} ? 'text-danger' : 'text-success'"></p>

    <!-- Upload Modal -->
    <div class="modal fade" id="uploadModal" tabindex="-1" aria-labelledby="uploadModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form method="POST" action="/attendance/upload" enctype="multipart/form-data">
                    <div class="modal-header">
                        <h5 class="modal-title" id="uploadModalLabel">Upload Attendance File</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="file" name="file" accept=".csv,.xls,.xlsx" required class="form-control" />
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Upload</button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <!-- Attendance Table -->
    <div class="table-container">
        <table class="table table-bordered table-striped">
            <thead>
            <tr>
                <th>Employee ID</th>
                <th>Full Name</th>
                <th>Morning In</th>
                <th>Morning Out</th>
                <th>Afternoon In</th>
                <th>Afternoon Out</th>
                <th>Regular Hours</th>
                <th>OT Hours</th>
                <th>Total Hours</th>
                <th>Log Date</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="summary : ${summaries}">
                <td th:text="${summary.employeeId}"></td>
                <td th:text="${summary.employeeName}"></td>
                <td th:text="${summary.morningIn != null ? summary.morningIn : '-'}"></td>
                <td th:text="${summary.morningOut != null ? summary.morningOut : '-'}"></td>
                <td th:text="${summary.afternoonIn != null ? summary.afternoonIn : '-'}"></td>
                <td th:text="${summary.afternoonOut != null ? summary.afternoonOut : '-'}"></td>
                <td th:text="${summary.regularHours != null ? summary.regularHours : 0}"></td>
                <td th:text="${summary.overtimeHours != null ? summary.overtimeHours : 0}"></td>
                <td th:text="${summary.totalHours != null ? summary.totalHours : 0}"></td>
                <td th:text="${summary.logDate}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div class="pagination-wrapper">
        <nav>
            <ul class="pagination d-flex justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                    <span class="page-link" th:if="${currentPage == 1}">Previous</span>
                    <a class="page-link" th:if="${currentPage > 1}"
                       th:href="@{/attendance(week=${weekOffset}, page=${currentPage-1})}">Previous</a>
                </li>

                <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
                    th:classappend="${i == currentPage} ? 'active'">
                    <span class="page-link" th:if="${i == currentPage}" th:text="${i}"></span>
                    <a class="page-link" th:if="${i != currentPage}"
                       th:href="@{/attendance(week=${weekOffset}, page=${i})}" th:text="${i}"></a>
                </li>

                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                    <span class="page-link" th:if="${currentPage == totalPages}">Next</span>
                    <a class="page-link" th:if="${currentPage < totalPages}"
                       th:href="@{/attendance(week=${weekOffset}, page=${currentPage+1})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>

</main>
</body>
</html>
