<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>User Dashboard - Settings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/settings.js"></script>
</head>
<body>
<div class="container-fluid">
  <div class="row">

    <!-- Sidebar Navigation -->
    <nav class="col-md-2 p-0" th:replace="fragments/nav :: nav"></nav>

    <!-- Main Content -->
    <main class="col-md-10 ms-sm-auto px-4 py-4">
      <h4 class="mb-4">System Configuration</h4>

      <!-- Tabs -->
      <ul class="nav nav-tabs" id="systemConfigTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="payslipConfig-tab" data-bs-toggle="tab" data-bs-target="#payslipConfig" type="button" role="tab" aria-controls="payslipConfig" aria-selected="true">
            <i class="bi bi-gear me-1"></i> Payslip Configuration
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="payperiod-tab" data-bs-toggle="tab" data-bs-target="#payperiod" type="button" role="tab" aria-controls="payperiod" aria-selected="false">
            <i class="bi bi-calendar2-week me-1"></i> Pay Period Settings
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="attendance-tab" data-bs-toggle="tab" data-bs-target="#attendance" type="button" role="tab" aria-controls="attendance" aria-selected="false">
            <i class="bi bi-clock-history me-1"></i> Attendance Rules
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="holidays-tab" data-bs-toggle="tab" data-bs-target="#holidays" type="button" role="tab" aria-controls="holidays" aria-selected="false">
            <i class="bi bi-sun me-1"></i> Holidays
          </button>
        </li>
      </ul>

      <!-- Tab Content -->
      <div class="tab-content mt-4" id="systemConfigTabsContent">

        <!-- Payslip Configuration Tab -->
        <div class="tab-pane fade show active" id="payslipConfig" role="tabpanel" aria-labelledby="payslipConfig-tab">
          <form th:action="@{/admin/payslip/settings/save}" method="post">

            <!-- Buttons to Manage Earnings/Deductions -->
            <div class="d-flex justify-content-between mt-3 mb-4">
              <div>
                <button type="button" class="btn btn-secondary me-2" data-bs-toggle="modal" data-bs-target="#addEarningModal">Add Earning</button>
                <button type="button" class="btn btn-secondary me-2" data-bs-toggle="modal" data-bs-target="#configureEarningModal">Configure Earning</button>
                <button type="button" class="btn btn-secondary me-2" data-bs-toggle="modal" data-bs-target="#addDeductionModal">Add Deduction</button>
                <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#configureDeductionModal">Configure Deduction</button>
              </div>
              <div>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addConfigModal">Add Configuration</button>
              </div>
            </div>

            <!-- Payslip Configuration Table -->
            <table class="table table-bordered">
              <thead>
              <tr>
                <th>Position/s</th>
                <th>Earning list</th>
                <th>Deduction list</th>
                <th>Actions</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="conf : ${configList}">
                <td th:text="${conf.position}"></td>
                <td th:text="${conf.earningList}"></td>
                <td th:text="${conf.deductionList}"></td>
                <td>
                  <input type="checkbox" th:name="'visible_' + ${conf.id}" th:checked="${conf.visible}">
                </td>
              </tr>
              </tbody>
            </table>
          </form>
        </div>

        <!-- Pay Period Settings Tab -->
        <div class="tab-pane fade" id="payperiod" role="tabpanel" aria-labelledby="payperiod-tab">
          <form>
            <div class="mb-3">
              <label for="payFrequency" class="form-label">Payroll Frequency</label>
              <select class="form-select" id="payFrequency">
                <option value="weekly">Weekly</option>
                <option value="biweekly">Bi-Weekly</option>
                <option value="monthly">Monthly</option>
              </select>
            </div>
            <div class="row mb-3">
              <div class="col-md-6">
                <label for="payStart" class="form-label">Start of Pay Period</label>
                <input type="date" class="form-control" id="payStart">
              </div>
              <div class="col-md-6">
                <label for="payEnd" class="form-label">End of Pay Period</label>
                <input type="date" class="form-control" id="payEnd">
              </div>
            </div>
            <button type="button" class="btn btn-primary">Save Pay Period Settings</button>
          </form>
        </div>

        <!-- Attendance Rules Tab -->
        <div class="tab-pane fade" id="attendance" role="tabpanel" aria-labelledby="attendance-tab">
          <form>
            <div class="mb-3">
              <label for="workHours" class="form-label">Work Hours per Day</label>
              <input type="number" class="form-control" id="workHours" placeholder="e.g., 8">
            </div>
            <div class="mb-3">
              <label for="gracePeriod" class="form-label">Grace Period for Late Check-ins (minutes)</label>
              <input type="number" class="form-control" id="gracePeriod" placeholder="e.g., 15">
            </div>
            <div class="row mb-3">
              <div class="col-md-6">
                <label for="otRate" class="form-label">Overtime Rate (Multiplier)</label>
                <input type="number" step="0.01" class="form-control" id="otRate" placeholder="e.g., 1.25">
              </div>
              <div class="col-md-6">
                <label for="otStart" class="form-label">OT Starts After (hours)</label>
                <input type="number" class="form-control" id="otStart" placeholder="e.g., 8">
              </div>
            </div>
            <button type="button" class="btn btn-primary">Save Attendance Rules</button>
          </form>
        </div>

        <!-- Holidays Tab -->
        <div class="tab-pane fade" id="holidays" role="tabpanel" aria-labelledby="holidays-tab">
          <form>
            <div class="mb-3">
              <label for="holidayName" class="form-label">Holiday Name</label>
              <input type="text" class="form-control" id="holidayName" placeholder="Enter holiday name">
            </div>
            <div class="mb-3">
              <label for="holidayDate" class="form-label">Date</label>
              <input type="date" class="form-control" id="holidayDate">
            </div>
            <div class="mb-3">
              <label for="holidayType" class="form-label">Type</label>
              <select class="form-select" id="holidayType">
                <option value="regular">Regular</option>
                <option value="special">Special</option>
                <option value="national">National</option>
              </select>
            </div>
            <button type="button" class="btn btn-primary">Save Holiday</button>
          </form>
        </div>

      </div>
    </main>

    <!-- Modals (outside main) -->

    <!-- Add Configuration Modal -->
    <div class="modal fade" id="addConfigModal" tabindex="-1" aria-labelledby="addConfigModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <form th:action="@{/admin/payslip/settings/add}" method="post">
            <div class="modal-header">
              <h5 class="modal-title" id="addConfigModalLabel">Add Payslip Configuration</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label for="positionsSelect" class="form-label">Select Position/s to apply with</label>
                <select id="positionsSelect" name="positions" class="form-select" multiple>
                  <option th:each="pos : ${activePositions}"
                          th:value="${pos.positionId}"
                          th:text="${pos.title}"></option>
                </select>
              </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                  <label class="form-label">Earnings</label>
                  <div class="border p-2" style="height: 200px; overflow-y: auto;" id="earningsContainer">
                    <div class="form-check" th:each="earning : ${earningsList}">
                      <input class="form-check-input" type="checkbox" th:id="'earning_' + ${earning}" th:name="earnings" th:value="${earning}">
                      <label class="form-check-label" th:for="'earning_' + ${earning}" th:text="${earning}"></label>
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Deductions</label>
                  <div class="border p-2" style="height: 200px; overflow-y: auto;" id="deductionsContainer">
                    <div class="form-check" th:each="deduction : ${deductionsList}">
                      <input class="form-check-input" type="checkbox" th:id="'deduction_' + ${deduction}" th:name="deductions" th:value="${deduction}">
                      <label class="form-check-label" th:for="'deduction_' + ${deduction}" th:text="${deduction}"></label>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="submit" class="btn btn-success">Create Configuration</button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Add Earning Modal -->
    <div class="modal fade" id="addEarningModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form th:action="@{/admin/earnings/add}" method="post">
            <div class="modal-header">
              <h5 class="modal-title">Add New Earning</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <input type="text" class="form-control mb-2" name="name" placeholder="Earning Name" required>
              <textarea class="form-control" name="description" placeholder="Description"></textarea>
            </div>
            <div class="modal-footer">
              <button type="submit" class="btn btn-success">Add</button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Configure Earning Modal -->
    <div class="modal fade" id="configureEarningModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form>
            <div class="modal-header">
              <h5 class="modal-title">Configure Earning</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <div class="mb-2">
                <label>Earning Type</label>
                <select class="form-select">
                  <option th:each="earning : ${earningsList}" th:value="${earning}" th:text="${earning}"></option>
                </select>
              </div>
              <div class="mb-2">
                <label>Calculation Type</label>
                <select class="form-select">
                  <option value="Percentage">Percentage of Hourly Rate</option>
                  <option value="Fixed">Fixed Amount</option>
                </select>
              </div>
              <div class="mb-2">
                <label>Value</label>
                <input type="number" class="form-control" placeholder="e.g., 100 for 100% or 50 for fixed">
              </div>
              <div class="mb-2">
                <label>Optional Formula</label>
                <input type="text" class="form-control" placeholder="e.g., hours * rate * 1.5">
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-success">Save Configuration</button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Add Deduction Modal -->
    <div class="modal fade" id="addDeductionModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form th:action="@{/admin/deductions/add}" method="post">
            <div class="modal-header">
              <h5 class="modal-title">Add New Deduction</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <input type="text" class="form-control mb-2" name="name" placeholder="Deduction Name" required>
              <textarea class="form-control" name="description" placeholder="Description"></textarea>
            </div>
            <div class="modal-footer">
              <button type="submit" class="btn btn-success">Add</button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Configure Deduction Modal -->
    <div class="modal fade" id="configureDeductionModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form>
            <div class="modal-header">
              <h5 class="modal-title">Configure Deduction</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <div class="mb-2">
                <label>Deduction Type</label>
                <select class="form-select">
                  <option th:each="deduction : ${deductionsList}" th:value="${deduction}" th:text="${deduction}"></option>
                </select>
              </div>
              <div class="mb-2">
                <label>Calculation Type</label>
                <select class="form-select">
                  <option value="Percentage">Percentage of Salary</option>
                  <option value="Fixed">Fixed Amount</option>
                </select>
              </div>
              <div class="mb-2">
                <label>Value</label>
                <input type="number" class="form-control" placeholder="e.g., 10 for 10% or 500 for fixed">
              </div>
              <div class="mb-2">
                <label>Optional Formula</label>
                <input type="text" class="form-control" placeholder="e.g., salary * 0.1">
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-success">Save Configuration</button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
