<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>User Dashboard - Settings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container-fluid">
  <div class="row">

    <!-- Sidebar Navigation -->
    <nav class="col-md-2 p-0" th:replace="fragments/nav :: nav"></nav>

    <!-- Main Content -->
    <main class="col-md-10 ms-sm-auto px-4 py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>Settings</h4>
      </div>

      <!-- Settings Accordion -->
      <div class="accordion" id="settingsAccordion">

        <!-- User & Role Management -->
        <div class="accordion-item">
          <h2 class="accordion-header" id="headingUsers">
            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseUsers" aria-expanded="true" aria-controls="collapseUsers">
              <i class="bi bi-people-fill me-2"></i> User & Role Management
            </button>
          </h2>
          <div id="collapseUsers" class="accordion-collapse collapse show" aria-labelledby="headingUsers" data-bs-parent="#settingsAccordion">
            <div class="accordion-body">
              <button class="btn btn-primary mb-2">Manage Users</button>
              <button class="btn btn-secondary mb-2">Assign Roles & Permissions</button>
              <button class="btn btn-warning mb-2">Reset Passwords</button>
            </div>
          </div>
        </div>

        <!-- System Configuration -->
        <div class="accordion-item">
          <h2 class="accordion-header" id="headingSystem">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseSystem" aria-expanded="false" aria-controls="collapseSystem">
              <i class="bi bi-gear-fill me-2"></i> System Configuration
            </button>
          </h2>
          <div id="collapseSystem" class="accordion-collapse collapse" aria-labelledby="headingSystem" data-bs-parent="#settingsAccordion">
            <div class="accordion-body">
              <button class="btn btn-primary mb-2">Company Details</button>
              <button class="btn btn-secondary mb-2">Attendance Rules</button>
              <button class="btn btn-success mb-2">Payroll Settings</button>
            </div>
          </div>
        </div>

        <!-- Security & Access -->
        <div class="accordion-item">
          <h2 class="accordion-header" id="headingSecurity">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseSecurity" aria-expanded="false" aria-controls="collapseSecurity">
              <i class="bi bi-shield-lock-fill me-2"></i> Security & Access
            </button>
          </h2>
          <div id="collapseSecurity" class="accordion-collapse collapse" aria-labelledby="headingSecurity" data-bs-parent="#settingsAccordion">
            <div class="accordion-body">
              <button class="btn btn-danger mb-2">Two-Factor Authentication</button>
              <button class="btn btn-warning mb-2">Login Restrictions</button>
              <button class="btn btn-secondary mb-2">Audit Logs</button>
            </div>
          </div>
        </div>

        <!-- Backup & Maintenance -->
        <div class="accordion-item">
          <h2 class="accordion-header" id="headingBackup">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseBackup" aria-expanded="false" aria-controls="collapseBackup">
              <i class="bi bi-hdd-fill me-2"></i> Backup & Maintenance
            </button>
          </h2>
          <div id="collapseBackup" class="accordion-collapse collapse" aria-labelledby="headingBackup" data-bs-parent="#settingsAccordion">
            <div class="accordion-body">
              <button class="btn btn-primary mb-2">Backup Database</button>
              <button class="btn btn-secondary mb-2">Restore Database</button>
              <button class="btn btn-warning mb-2">Clear Logs</button>
            </div>
          </div>
        </div>

        <!-- Customization / Preferences -->
        <div class="accordion-item">
          <h2 class="accordion-header" id="headingCustomization">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCustomization" aria-expanded="false" aria-controls="collapseCustomization">
              <i class="bi bi-palette-fill me-2"></i> Customization / Preferences
            </button>
          </h2>
          <div id="collapseCustomization" class="accordion-collapse collapse" aria-labelledby="headingCustomization" data-bs-parent="#settingsAccordion">
            <div class="accordion-body">
              <button class="btn btn-primary mb-2">Dashboard Layout</button>
              <button class="btn btn-secondary mb-2">Theme / Color</button>
              <button class="btn btn-success mb-2">Language Preferences</button>
            </div>
          </div>
        </div>

      </div>
      <!-- End of Accordion -->

    </main>
  </div>
</div>
</body>
</html>
