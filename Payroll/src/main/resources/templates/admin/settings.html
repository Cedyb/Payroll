<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>User Dashboard - Settings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/settings.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/settings.js" defer></script>
</head>
<body>
<div class="container-fluid">
  <div class="row">

    <!-- Sidebar Navigation -->
    <nav class="col-md-2 p-0" th:replace="fragments/nav :: nav"></nav>

    <!-- Main Content -->
    <main class="col-md-10 ms-sm-auto px-4 py-4">
      <h4 class="mb-4">System Configuration</h4>

      <!-- Tabs -->
      <ul class="nav nav-tabs" id="systemConfigTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="payslipConfig-tab" data-bs-toggle="tab" data-bs-target="#payslipConfig" type="button" role="tab" aria-controls="payslipConfig" aria-selected="true">
            <i class="bi bi-gear me-1"></i> Payslip Configuration
          </button>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="changeCredentials-tab" data-bs-toggle="tab" data-bs-target="#changeCredentials"
                  type="button" role="tab" aria-controls="changeCredentials" aria-selected="false">
            <i class="bi bi-person-gear me-1"></i> Change Credentials
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="holidays-tab" data-bs-toggle="tab" data-bs-target="#holidays" type="button" role="tab" aria-controls="holidays" aria-selected="false">
            <i class="bi bi-sun me-1"></i> Holidays
          </button>
        </li>
      </ul>
      <!-- Tab Content -->
      <div class="tab-content mt-4" id="systemConfigTabsContent">
        <!-- Payslip Configuration Tab -->
        <div class="tab-pane fade show active" id="payslipConfig" role="tabpanel" aria-labelledby="payslipConfig-tab">
            <!-- Buttons to Manage Earnings/Deductions -->
            <div class="d-flex justify-content-between mt-3 mb-4">
              <div>
                <button type="button" class="btn btn-secondary me-2" data-bs-toggle="modal" data-bs-target="#addEarningModal">Add Earning</button>
                <button type="button" class="btn btn-secondary me-2" data-bs-toggle="modal" data-bs-target="#configureEarningModal">Configure Earning</button>
                <button type="button" class="btn btn-secondary me-2" data-bs-toggle="modal" data-bs-target="#addDeductionModal">Add Deduction</button>
                <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#configureDeductionModal">Configure Deduction</button>
              </div>
              <div>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addConfigModal">Add Configuration</button>
              </div>
            </div>

            <!-- Payslip Configuration Table -->
            <table class="table table-bordered table-hover table-striped align-middle">
              <thead class="table-dark">
              <tr>
                <th style="width: 200px;">Position/s</th>
                <th style="width: 250px;">Earning list</th>
                <th style="width: 250px;">Deduction list</th>
                <th style="width: 180px;">Actions</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="conf : ${payslipConfigs}">
                <!-- Position -->
                <td>
                  <span th:text="${conf.position != null ? conf.position.title : 'N/A'}"></span>
                </td>

                <!-- Earnings -->
                <td>
                  <div class="overflow-auto" style="max-height: 80px;">
                    <span th:if="${#lists.isEmpty(conf.earnings)}">None</span>
                    <span th:each="earn, iterStat : ${conf.earnings}">
                <span th:text="${earn.name}"></span><span th:if="${!iterStat.last}">, </span>
              </span>
                  </div>
                </td>

                <!-- Deductions -->
                <td>
                  <div class="overflow-auto" style="max-height: 80px;">
                    <span th:if="${#lists.isEmpty(conf.deductions)}">None</span>
                    <span th:each="ded, iterStat : ${conf.deductions}">
                <span th:text="${ded.name}"></span><span th:if="${!iterStat.last}">, </span>
              </span>
                  </div>
                </td>

                <!-- Actions -->
                <td class="d-flex justify-content-center gap-1">
                  <!-- Edit Button -->
                  <button type="button" class="btn btn-sm btn-warning edit-config-btn"
                          th:data-config-id="${conf.id}">
                  <i class="bi bi-pencil"></i> Edit
                  </button>

                  <!-- Delete Button -->
                  <form th:action="@{/settings/config/delete/{id}(id=${conf.id})}" method="post">
                    <button type="submit" class="btn btn-sm btn-danger"
                            onclick="return confirm('Are you sure you want to delete this configuration?');">
                      <i class="bi bi-trash"></i> Delete
                    </button>
                  </form>

                </td>
              </tr>
              </tbody>
            </table>
        </div>

        <!-- 🔹 Combined Change Credentials Tab -->
        <div class="tab-pane fade" id="changeCredentials" role="tabpanel" aria-labelledby="changeCredentials-tab">
          <div class="row justify-content-center gx-4">

            <!-- Left Card: Change Email -->
            <!-- Left Card: Change Email -->
            <div class="col-md-5">
              <div class="card shadow-sm mb-3">
                <div class="card-body">
                  <h5 class="card-title mb-4 text-center">Change Email</h5>
                  <form id="changeEmailForm">
                    <!-- Current Password -->
                    <div class="mb-3">
                      <label for="currentPasswordForEmail" class="form-label">Current Password</label>
                      <input type="password" class="form-control" id="currentPasswordForEmail" name="currentPassword" required>
                    </div>

                    <!-- New Email -->
                    <div class="mb-3">
                      <label for="newEmail" class="form-label">New Email</label>
                      <input type="email" class="form-control" id="newEmail" name="newEmail" required>
                    </div>

                    <!-- Confirm New Email -->
                    <div class="mb-3">
                      <label for="confirmEmail" class="form-label">Confirm New Email</label>
                      <input type="email" class="form-control" id="confirmEmail" name="confirmEmail" required>
                    </div>

                    <!-- Feedback -->
                    <div id="emailFeedback" class="small mb-2"></div>

                    <!-- Submit -->
                    <button type="submit" class="btn btn-primary w-100">Update Email</button>
                  </form>
                </div>
              </div>
            </div>


            <!-- Right Card: Change Password -->
            <div class="col-md-5">
              <div class="card shadow-sm mb-3">
                <div class="card-body">
                  <h5 class="card-title mb-4 text-center">Change Password</h5>
                  <form id="changePasswordForm" th:action="@{/employee/change-password}" method="post">
                    <div class="mb-3">
                      <label for="currentPassword" class="form-label">Current Password</label>
                      <input type="password" class="form-control" id="currentPassword" name="currentPassword" required>
                    </div>
                    <div class="mb-3">
                      <label for="newPassword" class="form-label">New Password</label>
                      <input type="password" class="form-control" id="newPassword" name="newPassword" required>
                    </div>
                    <div class="mb-3">
                      <label for="confirmPassword" class="form-label">Confirm New Password</label>
                      <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                    </div>
                    <div id="passwordFeedback" class="small mb-2"></div>
                    <button type="submit" class="btn btn-primary w-100">Update Password</button>
                  </form>
                </div>
              </div>
            </div>

          </div>
        </div>

      </div> <!-- /.tab-content -->
    </main> <!-- /.main -->
  </div> <!-- /.row -->
</div> <!-- /.container-fluid -->

<!-- ================= Modals ================= -->
<!-- Add Configuration Modal -->
<div class="modal fade" id="addConfigModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form th:action="@{/settings/config/add}" method="post">
        <div class="modal-header">
          <h5 class="modal-title">Add Payslip Configuration</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Select Position/s to apply with</label>
            <div id="positionsContainer" class="border p-2" style="height: 300px; overflow-y: auto;">
              <div class="form-check" th:each="pos : ${activePositions}">
                <input class="form-check-input" type="checkbox"
                       th:id="'position_' + ${pos.positionId}"
                       name="positions"
                       th:value="${pos.positionId}"
                       th:disabled="${configuredPositionIds.contains(pos.positionId)}">
                <label class="form-check-label"
                       th:for="'position_' + ${pos.positionId}"
                       th:text="${pos.title}"></label>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6">
                <label class="form-label">Earnings</label>
                <div class="border p-2" id="earningsContainer" style="height: 200px; overflow-y: auto;">
                  <div class="form-check" th:each="earning : ${earningsList}">
                    <input class="form-check-input" type="checkbox" th:id="'earning_' + ${earning.id}" name="earnings" th:value="${earning.id}">
                    <label class="form-check-label ms-2" th:for="'earning_' + ${earning.id}" th:text="${earning.name}"></label>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Deductions</label>
                <div class="border p-2" id="deductionsContainer" style="height: 200px; overflow-y: auto;">
                  <div class="form-check" th:each="deduction : ${deductionsList}">
                    <input class="form-check-input" type="checkbox" th:id="'deduction_' + ${deduction.id}" name="deductions" th:value="${deduction.id}">
                    <label class="form-check-label ms-2" th:for="'deduction_' + ${deduction.id}" th:text="${deduction.name}"></label>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Create Configuration</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Add Earning Modal -->
<div class="modal fade" id="addEarningModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form>
        <div class="modal-header">
          <h5 class="modal-title">Add Earning</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="earningName" class="form-label">Earning Name</label>
            <input type="text" class="form-control" id="earningName" name="name" required>
          </div>
          <div class="mb-3">
            <label for="earningDesc" class="form-label">Description (optional)</label>
            <input type="text" class="form-control" id="earningDesc" name="description">
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Add</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Add Deduction Modal -->
<div class="modal fade" id="addDeductionModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form>
        <div class="modal-header">
          <h5 class="modal-title">Add Deduction</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label for="deductionName">Deduction Name</label>
            <input type="text" class="form-control" id="deductionName" name="name" required>
          </div>
          <div class="mb-2">
            <label for="deductionDesc">Description (optional)</label>
            <textarea class="form-control" id="deductionDesc" name="description"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Add</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Configure Earning Modal -->
<div class="modal fade" id="configureEarningModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form th:action="@{/settings/earnings/configure}" method="post">
        <div class="modal-header">
          <h5 class="modal-title">Configure Earning</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label>Earning Type</label>
            <select class="form-select" name="earningId">
              <option th:each="earning : ${earningsList}" th:value="${earning.id}" th:text="${earning.name}"></option>
            </select>
          </div>
          <div class="mb-2">
            <label>Calculation Type</label>
            <select class="form-select" name="calcType">
              <option value="Percentage">Percentage of Hourly Rate</option>
              <option value="Fixed">Fixed Amount</option>
            </select>
          </div>
          <div class="mb-2">
            <label>Value</label>
            <input type="number" class="form-control" name="value">
          </div>
          <div class="mb-2">
            <label>Optional Formula</label>
            <input type="text" class="form-control" name="formula">
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Save Configuration</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Configure Deduction Modal -->
<div class="modal fade" id="configureDeductionModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form th:action="@{/settings/deductions/configure}" method="post">
        <div class="modal-header">
          <h5 class="modal-title">Configure Deduction</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label>Deduction Type</label>
            <select class="form-select" name="deductionId">
              <option th:each="deduction : ${deductionsList}" th:value="${deduction.id}" th:text="${deduction.name}"></option>
            </select>
          </div>
          <div class="mb-2">
            <label>Calculation Type</label>
            <select class="form-select" name="calcType">
              <option value="Percentage">Percentage of Salary</option>
              <option value="Fixed">Fixed Amount</option>
            </select>
          </div>
          <div class="mb-2">
            <label>Value</label>
            <input type="number" class="form-control" name="value">
          </div>
          <div class="mb-2">
            <label>Optional Formula</label>
            <input type="text" class="form-control" name="formula">
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Save Configuration</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade" id="editConfigModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="editConfigForm" th:action="@{/admin/payslip/settings/update}" method="post">
        <input type="hidden" name="configId" id="editConfigId" />

        <div class="modal-header">
          <h5 class="modal-title">Edit Payslip Configuration</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Position</label>
            <input type="text" id="editConfigPosition" class="form-control" readonly />
          </div>

          <div class="row">
            <!-- Earnings -->
            <div class="col-md-6">
              <label class="form-label">Earnings</label>
              <div class="border p-2 overflow-auto" id="editEarningsContainer" style="height: 200px;"></div>
            </div>

            <!-- Deductions -->
            <div class="col-md-6">
              <label class="form-label">Deductions</label>
              <div class="border p-2 overflow-auto" id="editDeductionsContainer" style="height: 200px;"></div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Update Configuration</button>
        </div>
      </form>
    </div>
  </div>
</div>


</body>
</html>
