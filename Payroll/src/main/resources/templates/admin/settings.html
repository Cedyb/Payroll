<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>User Dashboard - Settings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container-fluid">
  <div class="row">

    <!-- Sidebar Navigation -->
    <nav class="col-md-2 p-0" th:replace="fragments/nav :: nav"></nav>

    <!-- Main Content -->
    <main class="col-md-10 ms-sm-auto px-4 py-4">
      <h4 class="mb-4">System Configuration</h4>

      <!-- Tabs -->
      <ul class="nav nav-tabs" id="systemConfigTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="company-tab" data-bs-toggle="tab" data-bs-target="#company" type="button" role="tab" aria-controls="company" aria-selected="true">
            <i class="bi bi-building me-1"></i> Company Info
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="payperiod-tab" data-bs-toggle="tab" data-bs-target="#payperiod" type="button" role="tab" aria-controls="payperiod" aria-selected="false">
            <i class="bi bi-calendar2-week me-1"></i> Pay Period Settings
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="attendance-tab" data-bs-toggle="tab" data-bs-target="#attendance" type="button" role="tab" aria-controls="attendance" aria-selected="false">
            <i class="bi bi-clock-history me-1"></i> Attendance Rules
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="holidays-tab" data-bs-toggle="tab" data-bs-target="#holidays" type="button" role="tab" aria-controls="holidays" aria-selected="false">
            <i class="bi bi-sun me-1"></i> Holidays
          </button>
        </li>
      </ul>

      <!-- Tab Content -->
      <div class="tab-content mt-4" id="systemConfigTabsContent">

        <!-- Company Info Tab -->
        <div class="tab-pane fade show active" id="company" role="tabpanel" aria-labelledby="company-tab">
          <form>
            <div class="row mb-3">
              <div class="col-md-6">
                <label for="companyName" class="form-label">Company Name</label>
                <input type="text" class="form-control" id="companyName" placeholder="Enter company name">
              </div>
              <div class="col-md-6">
                <label for="companyLogo" class="form-label">Company Logo</label>
                <input type="file" class="form-control" id="companyLogo">
              </div>
            </div>
            <div class="mb-3">
              <label for="companyAddress" class="form-label">Address</label>
              <input type="text" class="form-control" id="companyAddress" placeholder="Enter address">
            </div>
            <div class="row mb-3">
              <div class="col-md-6">
                <label for="companyContact" class="form-label">Contact Number</label>
                <input type="text" class="form-control" id="companyContact" placeholder="Enter contact number">
              </div>
              <div class="col-md-6">
                <label for="companyEmail" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="companyEmail" placeholder="Enter email address">
              </div>
            </div>
            <button type="button" class="btn btn-primary">Save Company Info</button>
          </form>
        </div>

        <!-- Pay Period Settings Tab -->
        <div class="tab-pane fade" id="payperiod" role="tabpanel" aria-labelledby="payperiod-tab">
          <form>
            <div class="mb-3">
              <label for="payFrequency" class="form-label">Payroll Frequency</label>
              <select class="form-select" id="payFrequency">
                <option value="weekly">Weekly</option>
                <option value="biweekly">Bi-Weekly</option>
                <option value="monthly">Monthly</option>
              </select>
            </div>
            <div class="row mb-3">
              <div class="col-md-6">
                <label for="payStart" class="form-label">Start of Pay Period</label>
                <input type="date" class="form-control" id="payStart">
              </div>
              <div class="col-md-6">
                <label for="payEnd" class="form-label">End of Pay Period</label>
                <input type="date" class="form-control" id="payEnd">
              </div>
            </div>
            <button type="button" class="btn btn-primary">Save Pay Period Settings</button>
          </form>
        </div>

        <!-- Attendance Rules Tab -->
        <div class="tab-pane fade" id="attendance" role="tabpanel" aria-labelledby="attendance-tab">
          <form>
            <div class="mb-3">
              <label for="workHours" class="form-label">Work Hours per Day</label>
              <input type="number" class="form-control" id="workHours" placeholder="e.g., 8">
            </div>
            <div class="mb-3">
              <label for="gracePeriod" class="form-label">Grace Period for Late Check-ins (minutes)</label>
              <input type="number" class="form-control" id="gracePeriod" placeholder="e.g., 15">
            </div>
            <div class="row mb-3">
              <div class="col-md-6">
                <label for="otRate" class="form-label">Overtime Rate (Multiplier)</label>
                <input type="number" step="0.01" class="form-control" id="otRate" placeholder="e.g., 1.25">
              </div>
              <div class="col-md-6">
                <label for="otStart" class="form-label">OT Starts After (hours)</label>
                <input type="number" class="form-control" id="otStart" placeholder="e.g., 8">
              </div>
            </div>
            <button type="button" class="btn btn-primary">Save Attendance Rules</button>
          </form>
        </div>

        <!-- Holidays Tab -->
        <div class="tab-pane fade" id="holidays" role="tabpanel" aria-labelledby="holidays-tab">
          <form>
            <div class="mb-3">
              <label for="holidayName" class="form-label">Holiday Name</label>
              <input type="text" class="form-control" id="holidayName" placeholder="Enter holiday name">
            </div>
            <div class="mb-3">
              <label for="holidayDate" class="form-label">Date</label>
              <input type="date" class="form-control" id="holidayDate">
            </div>
            <div class="mb-3">
              <label for="holidayType" class="form-label">Type</label>
              <select class="form-select" id="holidayType">
                <option value="regular">Regular</option>
                <option value="special">Special</option>
                <option value="national">National</option>
              </select>
            </div>
            <button type="button" class="btn btn-primary">Save Holiday</button>
          </form>
        </div>

      </div>
    </main>
  </div>
</div>
</body>
</html>
