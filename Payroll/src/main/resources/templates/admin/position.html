<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Positions Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/position.css" />
    <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/positions.js"></script>

    <style>
        main {
            margin-left: 240px;
        }
        .search-row {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">

        <nav th:replace="fragments/nav :: nav"></nav>

        <main class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4>Welcome, Mr. John</h4>
                    <h2>Positions</h2>
                </div>

                <button id="openModalBtn" type="button" class="btn btn-primary"
                        data-bs-toggle="modal" data-bs-target="#myModal">
                    <i class="bi bi-plus-circle"></i> Add Position
                </button>
            </div>


            <div class="row search-row">
                <div class="col-md-3">
                    <input type="text" id="searchTitle" class="form-control" placeholder="Search by title">
                </div>
                <div class="col-md-3">
                    <select id="searchDepartment" class="form-control">
                        <option value="">All Departments</option>
                        <option th:each="dept : ${departments}" th:value="${dept.departmentId}" th:text="${dept.name}"></option>
                    </select>
                </div>

            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle" th:if="${not #lists.isEmpty(positionList)}">
                            <thead class="table-light">
                            <tr>
                                <th>Position ID</th>
                                <th>Title</th>
                                <th>Department</th>
                                <th>Hourly Rate</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="position : ${positionList}">
                                <td th:text="${position.positionId}"></td>
                                <td th:text="${position.title}"></td>
                                <td th:text="${position.department.name}" th:data-id="${position.department.departmentId}"></td>
                                <td th:text="${position.hourlyRate}"></td>
                                <td>
                                    <button type="button"
                                            class="btn btn-warning btn-sm js-positions-update"
                                            th:attr="data-id=${position.positionId},
                                                     data-deptid=${position.department.departmentId},
                                                     data-title=${position.title},
                                                     data-hourly-rate=${position.hourlyRate}">
                                        <i class="bi bi-pencil-square"></i> Update
                                    </button>
                                    <button type="button"
                                            class="btn btn-danger btn-sm js-positions-delete"
                                            th:attr="data-id=${position.positionId}">
                                        <i class="bi bi-trash"></i> Delete
                                    </button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>


<div class="modal fade" id="myModal" tabindex="-1" aria-labelledby="positionModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create Position</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form th:action="@{/positions/create}" th:object="${positionsForm}" id="positionModalForm" method="post">
                    <div class="form-group mb-3">
                        <label for="titleInput">Job Title</label>
                        <input type="text" id="titleInput" class="form-control"
                               th:field="*{title}" placeholder="e.g. Software Engineer" required>
                    </div>
                    <div class="form-group mb-3">
                        <label for="deptInput">Department</label>
                        <select id="deptInput" class="form-control" th:field="*{departmentId}" required>
                            <option value="">-- Select Department --</option>
                            <option th:each="dept : ${departments}"
                                    th:value="${dept.departmentId}"
                                    th:text="${dept.name}"></option>
                        </select>
                    </div>
                    <div class="form-group mb-3">
                        <label for="hourlyRateInput">Hourly Rate</label>
                        <input type="number" id="hourlyRateInput" class="form-control"
                               th:field="*{hourlyRate}" placeholder="100" min="0" step="0.01" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="submit" form="positionModalForm" class="btn btn-primary">Submit</button>
            </div>
        </div>
    </div>
</div>


<div class="modal fade" id="myUpdateModal" tabindex="-1" aria-labelledby="updateModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Update Position</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form th:action="@{/positions/update}" th:object="${positionsForm}" id="positionUpdateModalForm" method="post">
                    <input type="hidden" id="positionIdUpdate" th:field="*{positionId}" />
                    <div class="form-group mb-3">
                        <label for="titleUpdate">Job Title</label>
                        <input type="text" id="titleUpdate" class="form-control" th:field="*{title}" required>
                    </div>
                    <div class="form-group mb-3">
                        <label for="deptUpdate">Department</label>
                        <select id="deptUpdate" class="form-control" th:field="*{departmentId}" required>
                            <option value="">-- Select Department --</option>
                            <option th:each="dept : ${departments}"
                                    th:value="${dept.departmentId}"
                                    th:text="${dept.name}"></option>
                        </select>
                    </div>
                    <div class="form-group mb-3">
                        <label for="hourlyUpdate">Hourly Rate</label>
                        <input type="number" id="hourlyUpdate" class="form-control" th:field="*{hourlyRate}" min="0" step="0.01" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="submit" form="positionUpdateModalForm" class="btn btn-primary">Update</button>
            </div>
        </div>
    </div>
</div>


</body>
</html>
