<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Positions Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/position.css" />
    <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/positions.js"></script>

    <style>
        main { margin-left: 240px; }
        .search-row { margin-bottom: 20px; }
        .readonly { pointer-events: none; opacity: 0.6; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav th:replace="fragments/nav :: nav"></nav>

        <main class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Positions</h2>

                <!-- Add Position button -->
                <button id="openModalBtn" type="button" class="btn btn-primary"
                        th:classappend="${session.role == 'SITE_ADMIN'} ? ' readonly'"
                        th:attr="data-bs-toggle=${session.role != 'SITE_ADMIN'} ? 'modal' : null,
                                 data-bs-target=${session.role != 'SITE_ADMIN'} ? '#myModal' : null">
                    <i class="bi bi-plus-circle"></i> Add Position
                </button>
            </div>

            <!-- Search bar -->
            <div class="row search-row">
                <div class="col-md-3">
                    <input type="text" id="searchTitle" class="form-control" placeholder="Search by title">
                </div>
                <div class="col-md-3">
                    <select id="searchDepartment" class="form-control">
                        <option value="">All Departments</option>
                        <option th:each="dept : ${departments}" th:value="${dept.departmentId}" th:text="${dept.name}"></option>
                    </select>
                </div>
            </div>

            <!-- Table -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle"
                               th:if="${not #lists.isEmpty(positionList)}">
                            <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Title</th>
                                <th>Department</th>
                                <th>Hourly Rate</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="position : ${positionList}">
                                <td th:text="${position.positionId}"></td>
                                <td th:text="${position.title}"></td>
                                <td th:text="${position.department.name}" th:data-id="${position.department.departmentId}"></td>
                                <td th:text="${position.hourlyRate}"></td>
                                <td>
                                    <button type="button"
                                            class="btn btn-warning btn-sm js-positions-update"
                                            th:classappend="${session.role == 'SITE_ADMIN'} ? ' readonly'"
                                            th:attr="data-id=${position.positionId},
                                                     data-deptid=${position.department.departmentId},
                                                     data-title=${position.title},
                                                     data-hourly-rate=${position.hourlyRate}">
                                        <i class="bi bi-pencil-square"></i> Update
                                    </button>
                                    <button type="button"
                                            class="btn btn-danger btn-sm js-positions-delete"
                                            th:classappend="${session.role == 'SITE_ADMIN'} ? ' readonly'"
                                            th:attr="data-id=${position.positionId}">
                                        <i class="bi bi-trash"></i> Delete
                                    </button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Pagination -->
            <div class="pagination-wrapper">
                <nav aria-label="Positions pagination">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${currentPage == 0} ? ' disabled'">
                            <a class="page-link" th:if="${currentPage > 0}"
                               th:href="@{/positions(page=${currentPage - 1}, size=10)}">Previous</a>
                            <span class="page-link" th:if="${currentPage == 0}">Previous</span>
                        </li>

                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, totalPages-1)}"
                            th:classappend="${i == currentPage} ? ' active'">
                            <a class="page-link" th:text="${i+1}" th:href="@{/positions(page=${i}, size=10)}"></a>
                        </li>

                        <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? ' disabled'">
                            <a class="page-link" th:if="${currentPage + 1 < totalPages}"
                               th:href="@{/positions(page=${currentPage + 1}, size=10)}">Next</a>
                            <span class="page-link" th:if="${currentPage + 1 >= totalPages}">Next</span>
                        </li>
                    </ul>
                </nav>
            </div>
        </main>
    </div>
</div>

<!-- Add Modal -->
<div class="modal fade" id="myModal" tabindex="-1" th:if="${session.role != 'SITE_ADMIN'}">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form th:action="@{/positions/create}" th:object="${positionsForm}" id="positionModalForm" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Create Position</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="form-group mb-3">
                        <label for="titleInput">Job Title</label>
                        <input type="text" id="titleInput" class="form-control" th:field="*{title}" required>
                    </div>
                    <div class="form-group mb-3">
                        <label for="deptInput">Department</label>
                        <select id="deptInput" class="form-control" th:field="*{departmentId}" required>
                            <option value="">-- Select Department --</option>
                            <option th:each="dept : ${departments}" th:value="${dept.departmentId}" th:text="${dept.name}"></option>
                        </select>
                    </div>
                    <div class="form-group mb-3">
                        <label for="hourlyRateInput">Hourly Rate</label>
                        <input type="number" id="hourlyRateInput" class="form-control"
                               th:field="*{hourlyRate}" min="0" step="0.01" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Update Modal -->
<div class="modal fade" id="myUpdateModal" tabindex="-1" th:if="${session.role != 'SITE_ADMIN'}">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form th:action="@{/positions/update}" th:object="${positionsForm}" id="positionUpdateModalForm" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Update Position</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="positionIdUpdate" th:field="*{positionId}">
                    <div class="form-group mb-3">
                        <label for="titleUpdate">Job Title</label>
                        <input type="text" id="titleUpdate" class="form-control" th:field="*{title}" required>
                    </div>
                    <div class="form-group mb-3">
                        <label for="deptUpdate">Department</label>
                        <select id="deptUpdate" class="form-control" th:field="*{departmentId}" required>
                            <option value="">-- Select Department --</option>
                            <option th:each="dept : ${departments}" th:value="${dept.departmentId}" th:text="${dept.name}"></option>
                        </select>
                    </div>
                    <div class="form-group mb-3">
                        <label for="hourlyUpdate">Hourly Rate</label>
                        <input type="number" id="hourlyUpdate" class="form-control"
                               th:field="*{hourlyRate}" min="0" step="0.01" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
