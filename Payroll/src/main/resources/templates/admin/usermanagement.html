<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>User Dashboard - User Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/usermanagement.css" />
  <script th:src="@{/js/usermanagement.js}"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    .readonly {
      pointer-events: none;
      opacity: 0.6;
      cursor: not-allowed;
    }

    .table-container {
      margin-top: 20px;
      padding: 20px;
      background-color: #f8f9fa;
      border: 2px solid #dee2e6;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }

    .table-container table {
      margin-bottom: 0;
    }

    main {
      margin-left: 240px;
    }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="fragments/nav :: nav"></nav>

    <main class="col-md-10 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>User Management</h4>
        <div>
          <button class="btn btn-secondary me-2"
                  data-bs-toggle="modal"
                  data-bs-target="#archivedModal"
                  th:classappend="${session.role == 'SITE_ADMIN'} ? ' readonly'">
            <i class="bi bi-archive"></i> View Archived
          </button>
          <button class="btn btn-primary"
                  id="addUserBtn"
                  th:classappend="${session.role == 'SITE_ADMIN'} ? ' readonly'">
            <i class="bi bi-person-plus"></i> Add User
          </button>
        </div>
      </div>

      <!-- Main User Table -->
      <div class="table-container">
        <div class="table-responsive">
          <table class="table table-striped table-hover" id="userTable">
            <thead>
            <tr>
              <th>ID</th>
              <th>Full Name</th>
              <th>Position</th>
              <th>Department</th>
              <th>Role</th>
              <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="emp : ${employees}">
              <td th:text="${emp.employeeId}"></td>
              <td th:text="${emp.fullName}"></td>
              <td th:text="${emp.position != null ? emp.position.title : 'N/A'}"></td>
              <td th:text="${emp.position != null && emp.position.department != null ? emp.position.department.name : 'N/A'}"></td>
              <td th:text="${emp.system_role}"></td>
              <td>
                <button class="btn btn-sm btn-warning js-edit-user"
                        th:classappend="${session.role == 'SITE_ADMIN'} ? ' readonly'"
                        th:data-id="${emp.employeeId}"
                        th:data-firstname="${emp.firstName}"
                        th:data-lastname="${emp.lastName}"
                        th:data-email="${emp.email}"
                        th:data-role="${emp.system_role}"
                        th:data-positionid="${emp.position != null ? emp.position.positionId : ''}"
                        th:data-departmentid="${emp.position != null && emp.position.department != null ? emp.position.department.departmentId : ''}"
                        th:data-hiredate="${emp.hireDate}"
                        th:data-address="${emp.address}"
                        th:data-phone="${emp.phone}">
                  Edit
                </button>

                <form th:action="@{'/usermanagement/' + ${emp.employeeId} + '/delete'}"
                      method="post" style="display:inline"
                      th:classappend="${session.role == 'SITE_ADMIN'} ? ' readonly'"
                      onsubmit="return confirm('Are you sure you want to archive this user?');">
                  <button type="submit" class="btn btn-sm btn-danger">Archive</button>
                </form>

                <form th:action="@{'/usermanagement/' + ${emp.employeeId} + '/reset-password'}"
                      method="post" style="display:inline"
                      th:classappend="${session.role == 'SITE_ADMIN'} ? ' readonly'">
                  <button type="submit" class="btn btn-sm btn-secondary">Reset Password</button>
                </form>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Archived Modal -->
      <div class="modal fade" id="archivedModal" tabindex="-1" th:if="${session.role != 'SITE_ADMIN'}">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Archived Employees</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <div class="table-container">
                <div class="table-responsive">
                  <table class="table table-striped table-hover">
                    <thead>
                    <tr>
                      <th>ID</th>
                      <th>Full Name</th>
                      <th>Position</th>
                      <th>Department</th>
                      <th>Role</th>
                      <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="arch : ${archivedEmployees}">
                      <td th:text="${arch.employeeId}"></td>
                      <td th:text="${arch.fullName}"></td>
                      <td th:text="${arch.position != null ? arch.position.title : 'N/A'}"></td>
                      <td th:text="${arch.position != null && arch.position.department != null ? arch.position.department.name : 'N/A'}"></td>
                      <td th:text="${arch.system_role}"></td>
                      <td>
                        <form th:action="@{'/usermanagement/' + ${arch.employeeId} + '/restore'}"
                              method="post" style="display:inline">
                          <button type="submit" class="btn btn-sm btn-success">Restore</button>
                        </form>
                      </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(archivedEmployees)}">
                      <td colspan="6" class="text-center text-muted">No archived employees</td>
                    </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
          </div>
        </div>
      </div>

      <!-- User Add/Edit Modal -->
      <div class="modal fade" id="userModal" tabindex="-1" th:if="${session.role != 'SITE_ADMIN'}">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Add / Edit User</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <form id="userForm" method="post">
                <input type="hidden" name="id" />
                <div class="row">
                  <div class="col-md-6">
                    <div class="mb-2"><label>First Name</label><input type="text" class="form-control" name="firstName" required></div>
                    <div class="mb-2"><label>Last Name</label><input type="text" class="form-control" name="lastName" required></div>
                    <div class="mb-2"><label>Email</label><input type="email" class="form-control" name="email" required></div>
                    <div class="mb-2"><label>Address</label><input type="text" class="form-control" name="address"></div>
                    <div class="mb-2"><label>Phone</label><input type="text" class="form-control" name="phone"></div>
                  </div>
                  <div class="col-md-6">
                    <div class="mb-2">
                      <label>Role</label>
                      <select class="form-select" name="system_role" required>
                        <option value="">Select Role</option>
                        <option value="EMPLOYEE">Employee</option>
                        <option value="SITE ADMIN">Site Admin</option>
                        <option value="CLERK">Clerk</option>
                      </select>
                    </div>
                    <div class="mb-2">
                      <label>Position</label>
                      <select class="form-select" name="positionId" required>
                        <option value="">Select Position</option>
                        <option th:each="pos : ${positionList}" th:value="${pos.positionId}" th:text="${pos.title}" th:attr="data-department=${pos.department.departmentId}"></option>
                      </select>
                    </div>
                    <div class="mb-2">
                      <label>Department</label>
                      <select class="form-select" name="departmentId" required>
                        <option value="">Select Department</option>
                        <option th:each="dept : ${departments}" th:value="${dept.departmentId}" th:text="${dept.name}"></option>
                      </select>
                    </div>
                    <div class="mb-2"><label>Hire Date</label><input type="date" class="form-control" name="hireDate" required></div>
                  </div>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button class="btn btn-primary" id="saveUserBtn">Save</button>
            </div>
          </div>
        </div>
      </div>


      <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="resetToast" class="toast align-items-center text-bg-success border-0" role="alert">
          <div class="d-flex">
            <div class="toast-body">✅ Password has been reset to <strong>password</strong>.</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
