<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>User Dashboard - User Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
    <nav class="col-md-2 p-0" th:replace="fragments/nav :: nav"></nav>

    <!-- Main Content -->
    <main class="col-md-10 ms-sm-auto px-4 py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>User Management</h4>
        <div>
          <button class="btn btn-secondary me-2" data-bs-toggle="modal" data-bs-target="#archivedModal">
            <i class="bi bi-archive"></i> View Archived
          </button>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal" id="addUserBtn">
            <i class="bi bi-person-plus"></i> Add User
          </button>
        </div>
      </div>

      <!-- User Table -->
      <div class="table-responsive">
        <table class="table table-striped table-hover" id="userTable">
          <thead>
          <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Position</th>
            <th>Department</th>
            <th>System Role</th>
            <th>Actions</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="emp : ${employees}">
            <td th:text="${emp.employeeId}"></td>
            <td th:text="${emp.fullName}"></td>
            <td th:text="${emp.position != null ? emp.position.title : 'N/A'}"></td>
            <td th:text="${emp.position != null && emp.position.department != null ? emp.position.department.name : 'N/A'}"></td>
            <td th:text="${emp.system_role}"></td>
            <td>
              <!-- Edit button -->
              <button class="btn btn-sm btn-warning me-1 js-edit-user"
                      th:data-id="${emp.employeeId}"
                      th:data-firstname="${emp.firstName}"
                      th:data-lastname="${emp.lastName}"
                      th:data-email="${emp.email}"
                      th:data-role="${emp.system_role}"
                      th:data-positionid="${emp.position != null ? emp.position.positionId : ''}"
                      th:data-departmentid="${emp.position != null && emp.position.department != null ? emp.position.department.departmentId : ''}"
                      th:data-hiredate="${emp.hireDate}"
                      th:data-address="${emp.address}"
                      th:data-phone="${emp.phone}">

                Edit
              </button>

              <!-- Delete Form -->
              <form th:action="@{'/usermanagement/' + ${emp.employeeId} + '/delete'}"
                    method="post" style="display:inline"
                    onsubmit="return confirm('Are you sure you want to archive this user?');">
                <button type="submit" class="btn btn-sm btn-danger">Archive</button>
              </form>

              <!-- Reset Password Form -->
              <form th:action="@{'/usermanagement/' + ${emp.employeeId} + '/reset-password'}"
                    method="post" style="display:inline">
                <button type="submit" class="btn btn-sm btn-secondary">
                  Reset Password
                </button>
              </form>
            </td>
          </tr>
          </tbody>
        </table>
      </div>

      <!-- Archived Employees Modal -->
      <div class="modal fade" id="archivedModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Archived Employees</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <div class="table-responsive">
                <table class="table table-striped table-hover">
                  <thead>
                  <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Position</th>
                    <th>Department</th>
                    <th>System Role</th>
                    <th>Action</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr th:each="arch : ${archivedEmployees}">
                    <td th:text="${arch.employeeId}"></td>
                    <td th:text="${arch.fullName}"></td>
                    <td th:text="${arch.position != null ? arch.position.title : 'N/A'}"></td>
                    <td th:text="${arch.position != null && arch.position.department != null ? arch.position.department.name : 'N/A'}"></td>
                    <td th:text="${arch.system_role}"></td>
                    <td>
                      <form th:action="@{'/usermanagement/' + ${arch.employeeId} + '/restore'}"
                            method="post" style="display:inline">
                        <button type="submit" class="btn btn-sm btn-success">
                          Restore
                        </button>
                      </form>
                    </td>
                  </tr>
                  <tr th:if="${#lists.isEmpty(archivedEmployees)}">
                    <td colspan="6" class="text-center text-muted">No archived employees</td>
                  </tr>
                  </tbody>
                </table>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Add/Edit User Modal -->
      <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Add / Edit User</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <form id="userForm" method="post">
                <input type="hidden" name="id" />
                <input type="text" class="form-control mb-2" placeholder="First Name" name="firstName" required>
                <input type="text" class="form-control mb-2" placeholder="Last Name" name="lastName" required>
                <input type="email" class="form-control mb-2" placeholder="Email" name="email" required>
                <input type="text" class="form-control mb-2" placeholder="Address" name="address">
                <input type="text" class="form-control mb-2" placeholder="Phone" name="phone">

                <!-- Role -->
                <select class="form-select mb-2" name="system_role" required>
                  <option value="">Select Role</option>
                  <option value="EMPLOYEE">Employee</option>
                  <option value="SITE_ADMIN">Site Admin</option>
                  <option value="CLERK">Clerk</option>
                </select>

                <!-- Position -->
                <select class="form-select mb-2" name="positionId" required>
                  <option value="">Select Position</option>
                  <option th:each="pos : ${positionList}"
                          th:value="${pos.positionId}"
                          th:text="${pos.title}">
                  </option>
                </select>

                <!-- Department -->
                <select class="form-select mb-2" name="departmentId" required>
                  <option value="">Select Department</option>
                  <option th:each="dept : ${departments}"
                          th:value="${dept.departmentId}"
                          th:text="${dept.name}">
                  </option>
                </select>

                <!-- Hire Date -->
                <input type="date" class="form-control mb-2" name="hireDate" required placeholder="Hire Date">
              </form>
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button class="btn btn-primary" id="saveUserBtn">Save</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Toast for reset -->
      <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="resetToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
          <div class="d-flex">
            <div class="toast-body">
              ✅ Password has been reset to <strong>password</strong>.
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- JS -->
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has("resetSuccess")) {
      const toastEl = document.getElementById("resetToast");
      const toast = new bootstrap.Toast(toastEl);
      toast.show();
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    const userModal = new bootstrap.Modal(document.getElementById("userModal"));
    const userForm = document.getElementById("userForm");
    const saveUserBtn = document.getElementById("saveUserBtn");

    // Add User
    document.getElementById("addUserBtn").addEventListener("click", () => {
      userForm.reset();
      userForm.action = "/usermanagement/create";
      userForm.method = "post";
      document.querySelector("#userModal .modal-title").textContent = "Add User";
      saveUserBtn.textContent = "Save";
    });

    // Edit User
    document.querySelectorAll(".js-edit-user").forEach(btn => {
      btn.addEventListener("click", () => {
        userForm.reset();
        userForm.action = /usermanagement/${btn.dataset.id}/update;
        userForm.method = "post";

        userForm.querySelector("input[name='id']").value = btn.dataset.id;
        userForm.querySelector("input[name='firstName']").value = btn.dataset.firstname;
        userForm.querySelector("input[name='lastName']").value = btn.dataset.lastname;
        userForm.querySelector("input[name='email']").value = btn.dataset.email;
        userForm.querySelector("select[name='system_role']").value = btn.dataset.role;
        userForm.querySelector("input[name='address']").value = btn.dataset.address || '';
        userForm.querySelector("input[name='phone']").value = btn.dataset.phone || '';


        if (btn.dataset.positionid) {
          userForm.querySelector("select[name='positionId']").value = btn.dataset.positionid;
        }
        if (btn.dataset.departmentid) {
          userForm.querySelector("select[name='departmentId']").value = btn.dataset.departmentid;
        }

        // Set hire date
        userForm.querySelector("input[name='hireDate']").value = btn.dataset.hiredate || '';

        document.querySelector("#userModal .modal-title").textContent = "Edit User";
        saveUserBtn.textContent = "Update";

        userModal.show();
      });
    });

    // Save button
    saveUserBtn.addEventListener("click", () => {
      userForm.submit();
    });
  });
</script>

</body>
</html>
