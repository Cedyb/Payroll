<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>User Dashboard - User Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
    <nav class="col-md-2 p-0" th:replace="fragments/nav :: nav"></nav>

    <!-- Main Content -->
    <main class="col-md-10 ms-sm-auto px-4 py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>User Management</h4>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal">
          <i class="bi bi-person-plus"></i> Add User
        </button>
      </div>

      <!-- Search and Filter -->
      <div class="row mb-3">
        <div class="col-md-6">
          <input type="text" class="form-control" placeholder="Search users..." id="searchInput">
        </div>
        <div class="col-md-3">
          <select class="form-select" id="roleFilter">
            <option value="">All Roles</option>
            <option value="Mason">Mason</option>
            <option value="Foreman">Foreman</option>
            <option value="Admin">Admin</option>
            <option value="HR">HR</option>
          </select>
        </div>
      </div>

      <!-- User Table -->
      <div class="table-responsive">
        <table class="table table-striped table-hover" id="userTable">
          <thead>
          <tr>
            <th>#</th>
            <th>Username</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Position</th>
            <th>Actions</th>
          </tr>
          </thead>
          <tbody>
          <!-- Loop real employees -->
          <tr th:each="emp, iterStat : ${employees}">
            <td th:text="${iterStat.count}"></td>
            <td th:text="${emp.username}"></td>
            <td th:text="${emp.fullName}"></td>
            <td th:text="${emp.email}">j</td>
            <td th:text="${emp.role}"></td>
            <td th:text="${emp.position != null ? emp.position.title : 'N/A'}"></td>
            <td>
              <button class="btn btn-sm btn-warning me-1">Edit</button>
              <button class="btn btn-sm btn-danger">Delete</button>

              <!-- Reset Password Form -->
              <form th:action="@{'/usermanagement/' + ${emp.employeeId} + '/reset-password'}"
                    method="post" style="display:inline">
                <button type="submit" class="btn btn-sm btn-secondary">
                  Reset Password
                </button>
              </form>
            </td>
          </tr>
          </tbody>
        </table>
      </div>

      <!-- Add/Edit User Modal -->
      <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Add / Edit User</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <form id="userForm">
                <input type="text" class="form-control mb-2" placeholder="Username" name="username" required>
                <input type="text" class="form-control mb-2" placeholder="Full Name" name="fullname" required>
                <input type="email" class="form-control mb-2" placeholder="Email" name="email" required>
                <select class="form-select mb-2" name="role" required>
                  <option value="">Select Role</option>
                  <option value="Mason">Mason</option>
                  <option value="Foreman">Foreman</option>
                  <option value="Admin">Admin</option>
                  <option value="HR">HR</option>
                </select>
                <input type="text" class="form-control mb-2" placeholder="Department" name="department" required>
              </form>
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button class="btn btn-primary" id="saveUserBtn">Save</button>
            </div>
          </div>
        </div>
      </div>

      <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="resetToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
          <div class="d-flex">
            <div class="toast-body">
              ✅ Password has been reset to <strong>password</strong>.
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Optional JavaScript for basic search/filter functionality -->
<script>
  const searchInput = document.getElementById('searchInput');
  const roleFilter = document.getElementById('roleFilter');
  const userTable = document.getElementById('userTable').getElementsByTagName('tbody')[0];

  function filterTable() {
    const search = searchInput.value.toLowerCase();
    const role = roleFilter.value;

    for (let row of userTable.rows) {
      const username = row.cells[1].textContent.toLowerCase();
      const fullname = row.cells[2].textContent.toLowerCase();
      const email = row.cells[3].textContent.toLowerCase();
      const userRole = row.cells[4].textContent;

      const matchesSearch = username.includes(search) || fullname.includes(search) || email.includes(search);
      const matchesRole = !role || userRole === role;

      row.style.display = matchesSearch && matchesRole ? '' : 'none';
    }
  }

  searchInput.addEventListener('input', filterTable);
  roleFilter.addEventListener('change', filterTable);

  document.addEventListener("DOMContentLoaded", function() {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has("resetSuccess")) {
      const toastEl = document.getElementById("resetToast");
      const toast = new bootstrap.Toast(toastEl);
      toast.show();

      // Clean URL (remove query param after showing toast)
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  }); // ✅ this was missing
</script>

</body>
</html>
