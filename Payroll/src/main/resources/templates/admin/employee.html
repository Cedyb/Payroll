<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employees</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css" />
    <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
    <script src="/js/employee.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav th:replace="fragments/nav :: nav"></nav>
        <main class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4>Welcome, Mr. John</h4>
                    <h2>Employees</h2>
                    <button id="openModalBtn" type="button" class="btn btn-primary">Add Employee</button>

                    <table class="table table-striped mt-3" th:if="${not #lists.isEmpty(employeeList)}">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Email</th>
                            <th>Position</th>
                            <th>Department</th>
                            <th>Address</th>
                            <th>Phone</th>
                            <th>Hire Date</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="emp : ${employeeList}">
                            <td class="emp-id" th:text="${emp.employeeId}"></td>
                            <td class="emp-firstname" th:text="${emp.firstName}"></td>
                            <td class="emp-lastname" th:text="${emp.lastName}"></td>
                            <td class="emp-email" th:text="${emp.email}"></td>

                            <!-- Hidden IDs for JS -->
                            <td class="emp-departmentid" th:text="${emp.position?.department?.departmentId}" hidden></td>
                            <td class="emp-positionid" th:text="${emp.position?.positionId}" hidden></td>

                            <td th:text="${emp.position?.title ?: 'N/A'}"></td>
                            <td th:text="${emp.position?.department?.name ?: 'N/A'}"></td>
                            <td class="emp-address" th:text="${emp.address}"></td>
                            <td class="emp-phone" th:text="${emp.phone}"></td>
                            <td class="emp-hiredate" th:text="${emp.hireDate}"></td>
                            <td>
                                <span class="js-employee-update text-primary" style="cursor:pointer;">UPDATE</span> |
                                <span class="js-employee-delete text-danger" th:data-id="${emp.employeeId}" style="cursor:pointer;">DELETE</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Add Modal -->
<div class="modal fade" id="myModal" tabindex="-1" aria-labelledby="employeeModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Add Employee</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form th:action="@{/employees/create}" th:object="${employeeForm}" id="employeeModalForm" method="post">
                <div class="modal-body">
                    <div class="form-group mb-2">
                        <label>Username</label>
                        <input type="text" th:field="*{username}" class="form-control" required>
                    </div>
                    <div class="form-group mb-2">
                        <label>Password</label>
                        <input type="password" th:field="*{password}" class="form-control" required>
                    </div>

                    <div class="form-group mb-2">
                        <label>Department</label>
                        <select id="departmentAddDropdown" th:field="*{departmentId}" class="form-control" required>
                            <option value="">Select a Department</option>
                            <option th:each="dept : ${departments}"
                                    th:value="${dept.departmentId}"
                                    th:text="${dept.name}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group mb-2">
                        <label>Position</label>
                        <select id="positionAddDropdown" th:field="*{positionId}" class="form-control" required>
                            <option value="">Select Position</option>
                            <option th:each="pos : ${positionList}"
                                    th:value="${pos.positionId}"
                                    th:text="${pos.title}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group mb-2">
                        <label>First Name</label>
                        <input type="text" th:field="*{firstName}" class="form-control" required>
                    </div>
                    <div class="form-group mb-2">
                        <label>Last Name</label>
                        <input type="text" th:field="*{lastName}" class="form-control" required>
                    </div>
                    <div class="form-group mb-2">
                        <label>Email</label>
                        <input type="email" th:field="*{email}" class="form-control">
                    </div>
                    <div class="form-group mb-2">
                        <label>Address</label>
                        <textarea th:field="*{address}" class="form-control"></textarea>
                    </div>
                    <div class="form-group mb-2">
                        <label>Phone</label>
                        <input type="text" th:field="*{phone}" class="form-control">
                    </div>
                    <div class="form-group mb-2">
                        <label>Hire Date</label>
                        <input type="date" th:field="*{hireDate}" class="form-control" required>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </div>
            </form>

        </div>
    </div>
</div>

<!-- Update Modal -->
<div class="modal fade" id="myUpdateModal" tabindex="-1" aria-labelledby="employeeUpdateLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Update Employee</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form th:action="@{/employees/update}" th:object="${employeeForm}" method="post" id="employeeUpdateModalForm">
                <div class="modal-body">
                    <!-- hidden ID -->
                    <input type="hidden" th:field="*{id}" id="employeeIdUpdate">

                    <div class="form-group mb-2">
                        <label>Username</label>
                        <input type="text" th:field="*{username}" id="usernameUpdate" class="form-control" required>
                    </div>
                    <div class="form-group mb-2">
                        <label>Password</label>
                        <input type="password" th:field="*{password}" id="passwordUpdate" class="form-control" required>
                    </div>

                    <div class="form-group mb-2">
                        <label>Department</label>
                        <select th:field="*{departmentId}" id="departmentUpdateDropdown" class="form-select" required>
                            <option value="">Select Department</option>
                            <option th:each="dept : ${departments}"
                                    th:value="${dept.departmentId}"
                                    th:text="${dept.name}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group mb-2">
                        <label>Position</label>
                        <select th:field="*{positionId}" id="positionUpdateDropdown" class="form-select" required>
                            <option value="">Select Position</option>
                            <option th:each="pos : ${positionList}"
                                    th:value="${pos.positionId}"
                                    th:text="${pos.title}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group mb-2">
                        <label>First Name</label>
                        <input type="text" th:field="*{firstName}" id="firstNameUpdate" class="form-control" required>
                    </div>
                    <div class="form-group mb-2">
                        <label>Last Name</label>
                        <input type="text" th:field="*{lastName}" id="lastNameUpdate" class="form-control" required>
                    </div>
                    <div class="form-group mb-2">
                        <label>Email</label>
                        <input type="email" th:field="*{email}" id="emailUpdate" class="form-control">
                    </div>
                    <div class="form-group mb-2">
                        <label>Address</label>
                        <textarea th:field="*{address}" id="addressUpdate" class="form-control"></textarea>
                    </div>
                    <div class="form-group mb-2">
                        <label>Phone</label>
                        <input type="text" th:field="*{phone}" id="phoneUpdate" class="form-control">
                    </div>
                    <div class="form-group mb-2">
                        <label>Hire Date</label>
                        <input type="date" th:field="*{hireDate}" id="hireDateUpdate" class="form-control" required>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Update</button>
                </div>
            </form>

        </div>
    </div>
</div>


<!-- Pagination -->
<div class="d-flex justify-content-center mt-3">
    <nav aria-label="Page navigation">
        <ul class="pagination">
            <li th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/employees(page=${currentPage-1})}">Previous</a>
            </li>
            <li th:each="i : ${#numbers.sequence(0, totalPages-1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/employees(page=${i})}" th:text="${i+1}">1</a>
            </li>
            <li th:classappend="${currentPage == totalPages-1} ? 'disabled'">
                <a class="page-link" th:href="@{/employees(page=${currentPage+1})}">Next</a>
            </li>
        </ul>
    </nav>
</div>

</body>
</html>
