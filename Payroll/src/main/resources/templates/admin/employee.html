<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employees</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/employee.css" />
    <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
    <script src="/js/employee.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<nav th:replace="fragments/nav :: nav"></nav>


<main>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4>Welcome, Mr. John</h4>
            <h2>Employees</h2>
            <button id="openModalBtn" type="button" class="btn btn-primary">Add Employee</button>
        </div>
    </div>


    <div class="row mb-3">
        <div class="col-md-3">
            <input type="text" id="searchName" class="form-control" placeholder="Search by name">
        </div>
        <div class="col-md-3">
            <select id="searchDepartment" class="form-control">
                <option value="">All Departments</option>
                <option th:each="dept : ${departments}" th:value="${dept.departmentId}" th:text="${dept.name}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <select id="searchPosition" class="form-control">
                <option value="">All Positions</option>
                <option th:each="pos : ${positionList}" th:value="${pos.positionId}" th:text="${pos.title}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <button id="searchBtn" class="btn btn-primary w-100">Filter</button>
        </div>
    </div>


    <div class="table-container p-3">
        <table class="table table-striped table-hover mt-3" th:if="${not #lists.isEmpty(employeeList)}">
            <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Position</th>
                <th>Department</th>
                <th>Address</th>
                <th>Phone</th>
                <th>Hire Date</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="emp : ${employeeList}">
                <td th:text="${emp.employeeId}"></td>
                <td th:text="${emp.firstName}"></td>
                <td th:text="${emp.lastName}"></td>
                <td th:text="${emp.email}"></td>
                <td th:text="${emp.position?.title ?: 'N/A'}"></td>
                <td th:text="${emp.position?.department?.name ?: 'N/A'}"></td>
                <td th:text="${emp.address}"></td>
                <td th:text="${emp.phone}"></td>
                <td th:text="${emp.hireDate}"></td>
                <td>
                    <span class="js-employee-update text-primary" style="cursor:pointer;">UPDATE</span> |
                    <span class="js-employee-delete text-danger" th:data-id="${emp.employeeId}" style="cursor:pointer;">DELETE</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>


    <div class="pagination-wrapper mt-3">
        <ul class="pagination justify-content-start">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/employees(page=${currentPage-1})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages-1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/employees(page=${i})}" th:text="${i+1}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages-1} ? 'disabled'">
                <a class="page-link" th:href="@{/employees(page=${currentPage+1})}">Next</a>
            </li>
        </ul>
    </div>
</main>
</body>
</html>
