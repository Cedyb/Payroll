<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Reports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
    <nav class="col-md-2 p-0" th:replace="fragments/nav :: nav"></nav>

    <!-- Main Content -->
    <main class="col-md-10 ms-sm-auto px-4 py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>Reports</h4>
      </div>

      <!-- Tabs -->
      <ul class="nav nav-tabs" id="reportsTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="reports-tab" data-bs-toggle="tab" data-bs-target="#reports" type="button" role="tab" aria-controls="reports" aria-selected="true">
            <i class="bi bi-bar-chart-line me-1"></i> Reports
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="audit-tab" data-bs-toggle="tab" data-bs-target="#audit" type="button" role="tab" aria-controls="audit" aria-selected="false">
            <i class="bi bi-shield-lock me-1"></i> Audit Logs
          </button>
        </li>
      </ul>

      <!-- Tab Content -->
      <div class="tab-content mt-4" id="reportsTabsContent">

        <!-- Reports Tab -->
        <div class="tab-pane fade show active" id="reports" role="tabpanel" aria-labelledby="reports-tab">
          <p>Generate and view system reports here.</p>
          <!-- Example: Add filters/buttons later -->
        </div>

        <!-- Audit Logs Tab -->
        <div class="tab-pane fade" id="audit" role="tabpanel" aria-labelledby="audit-tab">
          <div class="d-flex justify-content-between mb-3">
            <div class="d-flex">
              <input type="text" class="form-control me-2" placeholder="Search user or action">
              <input type="date" class="form-control">
            </div>
            <div>
              <button class="btn btn-primary btn-sm me-2"><i class="bi bi-file-earmark-pdf"></i> Export PDF</button>
              <button class="btn btn-success btn-sm"><i class="bi bi-file-earmark-excel"></i> Export Excel</button>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-striped table-hover">
              <thead class="table-light">
              <tr>
                <th scope="col">Date</th>
                <th scope="col">User</th>
                <th scope="col">Action</th>
                <th scope="col">Details</th>
              </tr>
              </thead>
              <tbody>
              <tr>
                <td>2025-09-29 10:32</td>
                <td>Admin</td>
                <td>Edited Attendance</td>
                <td>Changed status for Employee #12</td>
              </tr>
              <tr>
                <td>2025-09-28 15:20</td>
                <td>Manager</td>
                <td>Generated Payroll Report</td>
                <td>Payroll for September 2025</td>
              </tr>
              <tr>
                <td>2025-09-28 08:00</td>
                <td>User123</td>
                <td>Login</td>
                <td>Successful login</td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>
</body>
</html>
