<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/reports.css" />
    <script th:src="@{/js/reports.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-2 p-0" th:replace="fragments/nav :: nav"></nav>

        <!-- Main Content -->
        <main class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
            </div>

            <!-- Tabs -->
            <ul class="nav nav-tabs mb-4" id="reportsTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="reports-tab" data-bs-toggle="tab" data-bs-target="#reports" type="button" role="tab">
                        <i class="bi bi-bar-chart-line me-1"></i> Reports
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="audit-tab" data-bs-toggle="tab" data-bs-target="#audit" type="button" role="tab">
                        <i class="bi bi-shield-lock me-1"></i> Audit Logs
                    </button>
                </li>
            </ul>

            <!-- Tab Content -->
            <div class="tab-content" id="reportsTabsContent">

                <!-- Reports Tab -->
                <div class="tab-pane fade show active" id="reports" role="tabpanel" aria-labelledby="reports-tab">
                    <p>Generate and view system reports here.</p>
                </div>

                <!-- Audit Logs Tab -->
                <div class="tab-pane fade" id="audit" role="tabpanel" aria-labelledby="audit-tab">

                    <!-- Filters -->
                    <div class="row mb-3 g-2 align-items-center">
                        <div class="col-md-3">
                            <input type="text" class="form-control" placeholder="Search user or action" id="auditSearch">
                        </div>

                        <!-- Existing From Date -->
                        <div class="col-md-3">
                            <input type="date" class="form-control" id="auditDate" placeholder="From date">
                        </div>

                        <!-- Added To Date -->
                        <div class="col-md-3">
                            <input type="date" class="form-control" id="auditEndDate" placeholder="To date">
                        </div>

                        <div class="col-md-3 text-end">
                            <button class="btn btn-primary btn-sm me-2">
                                <i class="bi bi-file-earmark-pdf"></i> Export PDF
                            </button>
                            <button class="btn btn-success btn-sm">
                                <i class="bi bi-file-earmark-excel"></i> Export Excel
                            </button>
                        </div>
                    </div>

                    <!-- Table Container -->
                    <div id="auditTableContainer" class="table-container" th:fragment="auditTableContainer">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover" id="auditTable">
                                <thead class="table-light">
                                <tr>
                                    <th>Date</th>
                                    <th>User</th>
                                    <th>Action</th>
                                    <th>Details</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="log : ${auditLogs}">
                                    <td th:text="${#temporals.format(log.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                                    <td th:text="${log.user.firstName + ' ' + log.user.lastName}"></td>
                                    <td th:text="${log.action}"></td>
                                    <td th:text="${log.details}"></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(auditLogs)}">
                                    <td colspan="4" class="text-center text-muted">No audit logs found</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Pagination outside table-container -->
                    <div class="pagination-wrapper" th:if="${totalPages > 1}">
                        <ul class="pagination justify-content-center mt-3">
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link" href="#" th:attr="data-page=${currentPage - 1}">Previous</a>
                            </li>
                            <li class="page-item"
                                th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                th:classappend="${i == currentPage} ? 'active'">
                                <a class="page-link" href="#" th:text="${i + 1}" th:attr="data-page=${i}"></a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                <a class="page-link" href="#" th:attr="data-page=${currentPage + 1}">Next</a>
                            </li>
                        </ul>
                    </div>

                </div>
            </div>
        </main>
    </div>
</div>

</body>
</html>
