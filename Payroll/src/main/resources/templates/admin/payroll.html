<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Payroll</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/payroll.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/payroll.js}"></script>

  <style>
    /* Disable interaction for read-only buttons */
    .readonly {
      pointer-events: none;
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="fragments/nav :: nav"></nav>

    <main class="col-md-10 offset-md-2 content p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">PAYROLL</h4>
      </div>

      <!-- Search -->
      <form th:action="@{/payroll/search}" method="get" class="mb-3">
        <div class="input-group w-50">
          <input type="text" name="keyword" class="form-control"
                 placeholder="Search by name or ID..." th:value="${keyword}" />
          <button type="submit" class="btn btn-primary">Search</button>
        </div>
      </form>

      <!-- Table -->
      <div class="table-container mt-4">
        <div class="table-responsive">
          <table class="table align-middle table-hover">
            <thead class="table-light">
            <tr>
              <th>Name</th>
              <th>Employee ID</th>
              <th>Role</th>
              <th>Department</th>
              <th>Email</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="emp : ${employees}">
              <td class="d-flex align-items-center gap-3">
                <div class="initials"
                     th:text="${#strings.substring(emp.firstName, 0, 1)} + ${#strings.substring(emp.lastName, 0, 1)}">JD</div>
                <div>
                  <strong th:text="${emp.firstName + ' ' + emp.lastName}">Juan Dela Cruz</strong><br>
                  <span class="employee-email" th:text="${emp.email}">juan@example.com</span>
                </div>
              </td>

              <td>
                <span class="tag" th:text="'#' + ${emp.employeeId}">#000001</span>
              </td>

              <td th:text="${emp.position.title}">Position</td>
              <td th:text="${emp.position.department.name}">Department</td>
              <td th:text="${emp.email}">email@example.com</td>

              <td>
                <span class="badge"
                      th:text="${emp.payrollStatus != null ? emp.payrollStatus.name() : 'PENDING'}"
                      th:classappend="${emp.payrollStatus == T(com.example.Payroll.Entity.Payroll.PayrollStatus).APPROVED} ? ' bg-success' : ' bg-secondary'">
                  Status
                </span>
              </td>

              <td>
                <!-- Payslip button: disabled if SITE_ADMIN -->
                <a th:href="@{/admin/payslip/{id}(id=${emp.employeeId})}"
                   class="btn btn-primary btn-sm"
                   th:classappend="${session.role == 'SITE_ADMIN'} ? ' readonly'">
                  Payslip
                </a>

              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Pagination -->
      <nav aria-label="Page navigation example" class="mt-3">
        <ul class="pagination justify-content-center">
          <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
            <a class="page-link"
               th:href="@{/payroll(page=${currentPage - 1}, keyword=${keyword})}">Previous</a>
          </li>

          <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
              th:classappend="${i == currentPage} ? 'active'">
            <a class="page-link" th:href="@{/payroll(page=${i}, keyword=${keyword})}"
               th:text="${i + 1}">1</a>
          </li>

          <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
            <a class="page-link"
               th:href="@{/payroll(page=${currentPage + 1}, keyword=${keyword})}">Next</a>
          </li>
        </ul>
      </nav>

    </main>
  </div>
</div>
</body>
</html>
