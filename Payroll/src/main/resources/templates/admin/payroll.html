<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Payroll</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/payroll.js}"></script>
  <link rel="stylesheet" th:href="@{/css/payroll.css}" />


</head>
<body>
<div class="container-fluid">
  <div class="row">

    <nav th:replace="fragments/nav :: nav"></nav>

    <main class="col-md-10 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">PAYROLL</h4>
      </div>

      <!-- Search Bar -->
      <form th:action="@{/payroll/search}" method="get">
        <div class="input-group w-50">
          <input type="text" name="keyword" class="form-control"
                 placeholder="Search by name or ID..." th:value="${param.keyword}" />
          <button type="submit" class="btn btn-primary">Search</button>
        </div>
      </form>

      <!-- Employee Table -->
      <div class="table-responsive">
        <table class="table align-middle table-hover">
          <thead class="table-light">
          <tr>
            <th>Name</th>
            <th>Employee ID</th>
            <th>Role</th>
            <th>Department</th> <!-- NEW -->
            <th>Email</th>
            <th></th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="emp : ${employees}">
            <td class="d-flex align-items-center gap-3">
              <div class="initials" th:text="${#strings.substring(emp.firstName, 0, 1)} + ${#strings.substring(emp.lastName, 0, 1)}">JD</div>
              <div>
                <strong th:text="${emp.firstName + ' ' + emp.lastName}">Juan Dela Cruz</strong><br>
                <span class="employee-email" th:text="${emp.email}">juan@example.com</span>
              </div>
            </td>
            <td><span class="tag" th:text="'#' + ${emp.employeeId}">#000001</span></td>
            <td th:text="${emp.position.title}">Position</td>
            <td th:text="${emp.position.department.name}">Department</td>
            <td th:text="${emp.email}">email@example.com</td>
            <td class="position-relative">
              <span class="ellipsis" onclick="toggleDropdown(this)">⋮</span>
              <div class="dropdown-menu-custom">
                <ul class="list-unstyled mb-0">
                  <a th:href="@{/admin/payslip/{id}(id=${emp.employeeId})}" class="dropdown-item">
                    Payslip
                  </a>
                </ul>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>
</body>
</html>
