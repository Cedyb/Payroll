<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Payroll</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/payroll.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/payroll.js}" defer></script>

  <style>
    .readonly {
      pointer-events: none;
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body th:data-role="${session.role}">
<div class="container-fluid">
  <div class="row">
    <nav th:replace="fragments/nav :: nav"></nav>

    <main class="col-md-10 offset-md-2 content p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">PAYROLL</h4>
      </div>

      <div class="d-flex justify-content-between mb-4 align-items-center">

        <!-- 🔹 Search Form (Left) -->
        <div class="d-flex gap-2">
          <input type="text" id="searchInput" class="form-control"
                 placeholder="Search by Name or ID..." autocomplete="off" />
        </div>

        <!-- 🔹 Filter Form (Right) -->
        <div class="d-flex gap-2 align-items-center">

          <select id="departmentDropdown" name="departmentId" class="form-select" style="min-width: 200px;">
            <option value="">All Departments</option>
            <option th:each="dept : ${departments}"
                    th:value="${dept.departmentId}"
                    th:text="${dept.name}"
                    th:selected="${dept.departmentId == selectedDepartmentId}">
            </option>
          </select>

          <select id="positionDropdown" name="positionId" class="form-select" style="min-width: 200px;">
            <option value="">All Positions</option>
            <option th:each="pos : ${positions}"
                    th:value="${pos.positionId}"
                    th:text="${pos.title}"
                    th:selected="${pos.positionId == selectedPositionId}">
            </option>
          </select>

          <select id="statusDropdown" name="status" class="form-select" style="min-width: 200px;">
            <option value="">All Status</option>
            <option value="PENDING" th:selected="${status == 'PENDING'}">Pending</option>
            <option value="GENERATED" th:selected="${status == 'GENERATED'}">Generated</option>
            <option value="APPROVED" th:selected="${status == 'APPROVED'}">Approved</option>
          </select>

        </div>
      </div>

        <!-- Table -->
      <div class="table-container mt-4">
        <div class="table-responsive">
          <table class="table align-middle table-hover">
            <thead class="table-light">
            <tr>
              <th>Name</th>
              <th>Employee ID</th>
              <th>Role</th>
              <th>Department</th>
              <th>Email</th>
              <th>Status</th>
              <th class="text-center">
                <div class="d-flex justify-content-center align-items-center gap-2">
                  <span>Actions</span>
                  <input type="checkbox" id="selectAll" class="form-check-input">
                </div>
              </th>
            </tr>
            </thead>
            <tbody id="employeeTableBody" th:fragment="employeeRows">
            <tr th:each="emp : ${employees}">
              <td class="d-flex align-items-center gap-3">
                <div class="initials"
                     th:text="${#strings.substring(emp.firstName, 0, 1)} + ${#strings.substring(emp.lastName, 0, 1)}">JD</div>
                <div>
                  <strong th:text="${emp.firstName + ' ' + emp.lastName}">Juan Dela Cruz</strong><br>
                  <span class="employee-email" th:text="${emp.email}">juan@example.com</span>
                </div>
              </td>

              <td><span class="tag" th:text="'#' + ${emp.employeeId}">#000001</span></td>
              <td th:text="${emp.position != null ? emp.position.title : 'N/A'}">Position</td>
              <td th:text="${emp.position != null && emp.position.department != null ? emp.position.department.name : 'N/A'}">Department</td>
              <td th:text="${emp.email}">email@example.com</td>

              <td>
                <span class="badge"
                      th:text="${emp.payrollStatus != null ? emp.payrollStatus.name() : 'PENDING'}"
                      th:classappend="
                        ${emp.payrollStatus == T(com.example.Payroll.Entity.Payroll.PayrollStatus).APPROVED} ? ' bg-success' :
                        (${emp.payrollStatus == T(com.example.Payroll.Entity.Payroll.PayrollStatus).GENERATED} ? ' bg-warning' : ' bg-secondary')">
                  Status
                </span>
              </td>

              <td class="text-center">
                <div class="d-flex justify-content-center align-items-center gap-2">
                  <a th:href="@{/admin/payslip/{id}(id=${emp.employeeId})}"
                     class="btn btn-primary btn-sm"
                     th:classappend="${session.role == 'SITE_ADMIN'} ? ' readonly'">
                    Payslip
                  </a>
                  <input type="checkbox" class="form-check-input employee-checkbox" th:value="${emp.employeeId}">
                </div>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Pagination -->
      <div class="pagination-wrapper">
        <nav aria-label="Page navigation example">
          <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? ' disabled'">
              <a class="page-link" th:if="${currentPage > 0}"
                 th:href="@{/payroll(page=${currentPage - 1}, keyword=${keyword})}">Previous</a>
              <span class="page-link" th:if="${currentPage == 0}">Previous</span>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(1, totalPages == 0 ? 1 : totalPages)}"
                th:classappend="${i-1 == currentPage} ? ' active'">
              <a href="#" class="page-link" th:attr="data-page=${i-1}" th:text="${i}"></a>
            </li>


            <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? ' disabled'">
              <a class="page-link" th:if="${currentPage + 1 < totalPages}"
                 th:href="@{/payroll(page=${currentPage + 1}, keyword=${keyword})}">Next</a>
              <span class="page-link" th:if="${currentPage + 1 >= totalPages}">Next</span>
            </li>
          </ul>
        </nav>
      </div>
    </main>
  </div>
</div>

<!-- Floating button -->
<button id="actionButton" class="btn btn-success" style="display:none; position:fixed; bottom:20px; right:20px;"></button>

</body>
</html>
