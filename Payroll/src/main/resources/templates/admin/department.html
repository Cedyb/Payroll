<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Departments</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css" />
  <script src="https://code.jquery.com/jquery-3.6.3.min.js"
          integrity="sha256-pvPw+upLPUjgMXY0G+8O0xUf+/Im1MZjXxxgOcBQBXU="
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script th:src="@{/js/department.js}"></script>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <nav th:replace="fragments/nav :: nav"></nav>
    <main class="col-md-10 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h4>Welcome, Mr. John</h4>
          <h2>Departments</h2>
          <button id="openAddDeptModal" type="button" class="btn btn-success">
            Add Department
          </button>
        </div>
      </div>

      <table class="table table-striped table-bordered align-middle" th:if="${not #lists.isEmpty(departmentList)}">
        <thead>
        <tr>
          <th>ID</th>
          <th>Department Name</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="dept : ${departmentList}">
          <td th:text="${dept.departmentId}"></td>
          <td th:text="${dept.name}"></td>
          <td th:text="${dept.description}"></td>
          <td>
            <button type="button" class="btn btn-warning js-dept-update"
                    th:data-id="${dept.departmentId}"
                    th:data-name="${dept.name}"
                    th:data-description="${dept.description}">
              Edit
            </button>
            <a th:href="@{/departments/delete/{id}(id=${dept.departmentId})}"
               class="btn btn-danger"
               onclick="return confirm('Are you sure you want to delete this department?')">
              Delete
            </a>
          </td>
        </tr>
        </tbody>
      </table>
    </main>
  </div>
</div>

<!-- Add Department Modal -->
<div class="modal fade" id="deptAddModal" tabindex="-1" role="dialog" aria-labelledby="deptAddModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <form th:action="@{/departments/create}" th:object="${departmentsForm}" method="post" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="deptAddModalLabel">Add Department</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="form-group mb-3">
          <label for="deptNameInput">Department Name</label>
          <input type="text" id="deptNameInput" class="form-control" th:field="*{name}" required>
        </div>
        <div class="form-group mb-3">
          <label for="deptDescInput">Description</label>
          <input type="text" id="deptDescInput" class="form-control" th:field="*{description}">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Add Department</button>
      </div>
    </form>
  </div>
</div>

<!-- Update Department Modal -->
<div class="modal fade" id="deptUpdateModal" tabindex="-1" role="dialog" aria-labelledby="deptUpdateModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <form th:action="@{/departments/update}" th:object="${departmentsForm}" method="post" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="deptUpdateModalLabel">Edit Department</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="deptIdUpdate" th:field="*{departmentId}" />
        <div class="form-group mb-3">
          <label for="deptNameUpdate">Department Name</label>
          <input type="text" id="deptNameUpdate" class="form-control" th:field="*{name}" required>
        </div>
        <div class="form-group mb-3">
          <label for="deptDescUpdate">Description</label>
          <input type="text" id="deptDescUpdate" class="form-control" th:field="*{description}">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<script>
  $(document).ready(function () {
      $('#openAddDeptModal').on('click', function () {
          $('#deptAddModal').modal('show');
      });

      $('.js-dept-update').on('click', function () {
          const id = $(this).data('id');
          const name = $(this).data('name');
          const desc = $(this).data('description');

          $('#deptIdUpdate').val(id);
          $('#deptNameUpdate').val(name);
          $('#deptDescUpdate').val(desc);

          $('#deptUpdateModal').modal('show');
      });
  });
</script>

</body>
</html>
