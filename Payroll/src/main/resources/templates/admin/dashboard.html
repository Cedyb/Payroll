<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/app.css"/>
</head>
<body>

<nav th:replace="fragments/nav :: nav"></nav>

<main>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="${dashboardTitle}">Admin Dashboard</h2>
        <span class="text-muted">
            Welcome, <span th:text="${employee != null ? employee.fullName : 'User'}">User</span>
        </span>
    </div>

    <!-- Top Card: Weekly Attendance (Full Width, smaller chart) -->
    <div class="row g-4 mb-4">
        <div class="col-12 col-md-10 mx-auto"> <!-- narrower card -->
            <div class="dashboard-card text-center p-3">
                <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
                    <i class="bi bi-calendar-week fs-3 text-primary"></i>
                    <h5 class="mb-0">Weekly Attendance</h5>
                </div>
                <div class="d-flex flex-column align-items-center">
                    <canvas id="weeklyAttendanceChart" style="max-height: 200px; width: 100%;"></canvas>
                    <p class="fs-5 fw-bold mt-2">Total: <span th:text="${weeklyAttendanceTotal}">0</span></p>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4 mb-4 justify-content-center">
        <!-- Compensation Status -->
        <div class="col-md-5">
            <div class="dashboard-card text-center p-3">
                <div class="d-flex justify-content-between align-items-center mb-2 px-2">
                    <h5 class="mb-0">Compensation Status</h5>
                    <select id="departmentSelect" class="form-select w-50">
                        <option th:each="dept : ${departments}"
                                th:value="${dept.departmentId}"
                                th:text="${dept.name}"></option>
                    </select>
                </div>
                <canvas id="compensationChart" style="max-height: 300px;"></canvas>
            </div>
        </div>

        <!-- Total Employees -->
        <div class="col-md-5">
            <div class="dashboard-card text-center p-3">
                <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
                    <i class="bi bi-people-fill fs-3"></i>
                    <h5 class="mb-0">Total Employees</h5>
                </div>
                <p class="fs-5 fw-bold" th:text="${employeeCount}">0</p>
                <canvas id="employeeBarChart" style="max-height: 250px;"></canvas>
            </div>
        </div>
    </div>

</main>


<!-- JS Libraries -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Employee Bar Chart -->
<script th:inline="javascript">
    /* <![CDATA[ */
    const departmentData = /*[[${departmentBreakdown}]]*/ {};
    const departmentLabels = Object.keys(departmentData);
    const departmentCounts = Object.values(departmentData);

    const ctx = document.getElementById('employeeBarChart').getContext('2d');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: departmentLabels,
            datasets: [{
                label: 'Employees per Department',
                data: departmentCounts,
                backgroundColor: 'rgba(13, 110, 253, 0.7)',
                borderColor: 'rgba(13, 110, 253, 1)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return context.parsed.y + ' employees';
                        }
                    }
                }
            },
            scales: {
                y: { beginAtZero: true, precision: 0 }
            }
        }
    });
    /* ]]> */
</script>

<!-- Compensation Status Donut Chart -->
<script th:inline="javascript">
    /* <![CDATA[ */
    let ctxComp = document.getElementById('compensationChart').getContext('2d');
    let compensationChart;

    const statusLabels = ['Pending', 'Generated', 'Approved'];
    const statusColors = {
        'Pending': '#808080',
        'Generated': '#ffff00',
        'Approved': '#00ff00'
    };

    function loadCompensationChart(deptId) {
    $.ajax({
        url: /*[[@{/dashboard/compensation-status}]]*/,
        type: 'GET',
        data: { departmentId: deptId },
        success: function(data) {
            const values = statusLabels.map(label => data[label] || 0);
            const colors = statusLabels.map(label => statusColors[label]);

            if (compensationChart) compensationChart.destroy();

            compensationChart = new Chart(ctxComp, {
                type: 'doughnut',
                data: {
                    labels: statusLabels,
                    datasets: [{
                        data: values,
                        backgroundColor: colors,
                        borderColor: colors,
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const label = context.label || '';
                                    const value = context.raw || 0;
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0) || 1;
                                    const percentage = ((value / total) * 100).toFixed(1);
                                    return label + ': ' + value + ' (' + percentage + '%)';
                                }
                            }
                        }
                    },
                    cutout: '50%'
                }
            });
        }
    });
}


    $(document).ready(function() {
        loadCompensationChart($('#departmentSelect').val());
        $('#departmentSelect').change(function() {
            loadCompensationChart($(this).val());
        });
    });
    /* ]]> */
</script>

<!-- Weekly Attendance Line Chart -->
<script th:inline="javascript">
    /* <![CDATA[ */
    const dailyAttendance = /*[[${dailyAttendance}]]*/ {};
    const weeklyLabels = Object.keys(dailyAttendance); // Wednesday → Tuesday
    const weeklyData = Object.values(dailyAttendance);

    const ctxWeekly = document.getElementById('weeklyAttendanceChart').getContext('2d');
    new Chart(ctxWeekly, {
        type: 'line',
        data: {
            labels: weeklyLabels,
            datasets: [{
                label: 'Employees Present',
                data: weeklyData,
                fill: true,
                borderColor: 'rgba(13, 110, 253, 1)',
                backgroundColor: 'rgba(13, 110, 253, 0.2)',
                tension: 0.4,
                pointBackgroundColor: 'rgba(13, 110, 253, 1)',
                pointBorderColor: '#fff',
                pointRadius: 5
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: true },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return context.raw + ' employees';
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    precision: 0
                }
            }
        }
    });
    /* ]]> */
</script>


</body>
</html>
