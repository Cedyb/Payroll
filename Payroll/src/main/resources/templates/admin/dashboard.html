<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css"/>
    <style>
        body {
            overflow-x: hidden;
        }


        nav {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 240px;
            background-color: #fff;
            border-right: 1px solid #dee2e6;
            z-index: 1000;
        }


        main {
            margin-left: 240px;
            width: calc(100% - 240px);
            padding: 20px;
        }


        .dashboard-card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 20px;
            background: #fff;
        }

        .dashboard-card h5 {
            font-weight: bold;
        }

        .dashboard-card .icon {
            font-size: 2rem;
            color: #0d6efd;
        }
    </style>
</head>
<body>

<nav th:replace="fragments/nav :: nav"></nav>


<main>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Admin Dashboard</h2>
        <span class="text-muted">Welcome, Mr. John</span>
    </div>


    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="dashboard-card text-center">
                <div class="icon mb-2"><i class="bi bi-people-fill"></i></div>
                <h5>Total Employees</h5>
                <p class="fs-4 fw-bold" th:text="${employeeCount}">120</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="dashboard-card text-center">
                <div class="icon mb-2"><i class="bi bi-building"></i></div>
                <h5>Departments</h5>
                <p class="fs-4 fw-bold" th:text="${departmentCount}">5</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="dashboard-card text-center">
                <div class="icon mb-2"><i class="bi bi-calendar-check"></i></div>
                <h5>Attendance Today</h5>
                <p class="fs-4 fw-bold" th:text="${attendanceToday}">95%</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="dashboard-card text-center">
                <div class="icon mb-2"><i class="bi bi-clock-history"></i></div>
                <h5>Overtime Hours</h5>
                <p class="fs-4 fw-bold" th:text="${totalOvertime}">120</p>
            </div>
        </div>
    </div>


    <div class="row">
        <div class="col-md-6">
            <div class="dashboard-card">
                <h5>Recent Attendance Logs</h5>
                <table class="table table-sm table-striped mt-3">
                    <thead>
                    <tr>
                        <th>Employee</th>
                        <th>Time In</th>
                        <th>Time Out</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="log : ${recentLogs}">
                        <td th:text="${log.employeeName}">Jane Doe</td>
                        <td th:text="${log.timeIn}">08:00</td>
                        <td th:text="${log.timeOut}">17:00</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="col-md-6">
            <div class="dashboard-card">
                <h5>Departments Overview</h5>
                <ul class="list-group list-group-flush mt-3">
                    <li class="list-group-item d-flex justify-content-between align-items-center"
                        th:each="dept : ${departments}">
                        <span th:text="${dept.name}">IT Department</span>
                        <span class="badge bg-primary rounded-pill"
                              th:text="${dept.employeeCount}">25</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</main>
</body>
</html>
