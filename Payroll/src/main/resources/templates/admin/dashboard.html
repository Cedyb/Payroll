<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/app.css"/>
</head>
<body>

<nav th:replace="fragments/nav :: nav"></nav>

<main>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 th:text="${dashboardTitle}">Admin Dashboard</h2>
        <span class="text-muted">
            Welcome, <span th:text="${employee.fullName}">User</span>
        </span>
    </div>

    <!-- Top Cards -->
    <div class="row g-4 mb-4">
        <!-- Total Employees -->
        <div class="col-md-3">
            <div class="dashboard-card text-center">
                <!-- Header -->
                <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
                    <i class="bi bi-people-fill fs-3"></i>
                    <h5 class="mb-0">Total Employees</h5>
                    <p class="fs-4 fw-bold" th:text="${employeeCount}">0</p>
                </div>

                <!-- Total count -->


                <!-- Scrollable Breakdown -->
                <div class="mt-2" style="max-height: 6rem; overflow-y: auto;">
                    <ul class="list-unstyled small mb-0">
                        <li th:each="entry : ${departmentBreakdown.entrySet()}"
                            th:text="${entry.key + ' - ' + entry.value}">
                        </li>
                    </ul>
                </div>
            </div>
        </div>


        <!-- Departments -->
        <div class="col-md-3">
            <div class="dashboard-card text-center">
                <!-- Header -->
                <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
                    <i class="bi bi-building fs-3"></i>
                    <h5 class="mb-0">Departments</h5>
                </div>
                <!-- Scrollable List (max 3 items visible) -->
                <div class="mt-2" style="max-height: 4.8rem; overflow-y: auto;">
                    <ul class="list-unstyled mb-0">
                        <li th:each="dept : ${departments}" th:text="${dept.name}"></li>
                    </ul>
                </div>
            </div>
        </div>
        <!-- Attendance Today -->
        <div class="col-md-3">
            <div class="dashboard-card text-center">
                <div class="d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-calendar-check fs-3"></i>
                    <h5 class="mb-0">Attendance Today</h5>
                </div>
                <p class="fs-4 fw-bold">0</p>
            </div>
        </div>

        <!-- Overtime -->
        <div class="col-md-3">
            <div class="dashboard-card text-center">
                <div class="d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-clock-history fs-3"></i>
                    <h5 class="mb-0">Overtime Hours</h5>
                </div>
                <p class="fs-4 fw-bold">0</p>
            </div>
        </div>
    </div>
</main>
</body>
</html>
