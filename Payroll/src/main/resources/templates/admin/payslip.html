<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payslip - [[${employee.firstName}]] [[${employee.lastName}]]</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css" />
    <script th:src="@{/js/payslip.js}" defer></script>
</head>
<body>
<div class="container-fluid">
    <div class="row">

        <nav th:replace="fragments/nav :: nav"></nav>

        <main class="col-md-10 offset-md-2 content p-4">

            <!-- Navigation / Week selectors -->
            <div class="mb-3 d-flex flex-wrap gap-2 align-items-center">
                <a th:href="@{/payroll}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Back to Payroll
                </a>
                <a th:href="@{/admin/payslip/{id}(id=${employee.employeeId}, week=${weekOffset - 1})}" class="btn btn-outline-secondary">
                    <i class="bi bi-chevron-left"></i> Previous Week
                </a>
                <a th:href="@{/admin/payslip/{id}(id=${employee.employeeId}, week=${weekOffset + 1})}" class="btn btn-outline-secondary">
                    Next Week <i class="bi bi-chevron-right"></i>
                </a>

                <form th:action="@{/admin/payslip/{id}(id=${employee.employeeId})}" method="get" class="d-flex gap-2 ms-auto">

                    <select name="year" class="form-select" style="width:auto;" onchange="this.form.submit()">
                        <option th:each="y : ${years}" th:value="${y}" th:text="${y}"
                                th:selected="${y == selectedYear}"></option>
                    </select>

                    <select name="month" class="form-select" style="width:auto;" onchange="this.form.submit()">
                        <option value="">All Months</option>
                        <option th:each="m : ${months}" th:value="${m.value}" th:text="${m.name}"
                                th:selected="${m.value == selectedMonth}"></option>
                    </select>

                    <select class="form-select" id="week" name="week"
                            onchange="this.form.submit()">
                        <option th:each="week : ${weeks}"
                                th:value="${week.offset}"
                                th:text="${week.label}"
                                th:selected="${selectedWeek == week.offset}"></option>
                    </select>
                </form>
            </div>

            <!-- Employee Info -->
            <h4 class="fw-bold mb-3">Payslip for
                <span th:text="${employee.firstName + ' ' + employee.lastName}"></span>
            </h4>
            <hr>

            <!-- Attendance Table -->
            <div class="table-responsive mb-4">
                <table class="table table-bordered table-striped align-middle">
                    <thead class="table-secondary text-center">
                    <tr>
                        <th>Date</th>
                        <th>Morning In</th>
                        <th>Morning Out</th>
                        <th>Afternoon In</th>
                        <th>Afternoon Out</th>
                        <th>Regular Hours</th>
                        <th>OT Hours</th>
                        <th>Total Hours</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="att : ${attendanceList}">
                        <td th:text="${att.logDateWithDay}"></td>
                        <td th:text="${att.morningIn}"></td>
                        <td th:text="${att.morningOut}"></td>
                        <td th:text="${att.afternoonIn}"></td>
                        <td th:text="${att.afternoonOut}"></td>
                        <td class="text-end" th:text="${att.regularHours}"></td>
                        <td class="text-end" th:text="${att.overtimeHours}"></td>
                        <td class="text-end" th:text="${att.totalHours}"></td>
                        <td th:text="${att.status}"></td>
                    </tr>
                    <tr th:if="${attendanceList.size() == 0}">
                        <td colspan="9" class="text-center">No attendance records found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Toggle Edit Mode -->
            <button id="toggleEditBtn" class="btn btn-primary mb-3">
                <i class="bi bi-pencil-square"></i> Enable Edit Mode
            </button>

            <!-- Payslip Earnings/Deductions -->
            <form th:action="@{/admin/payslip/{id}/save(id=${employee.employeeId})}" method="post">
                <div class="table-responsive">
                    <table class="table table-bordered align-middle text-center">
                        <thead class="table-secondary">
                        <tr>
                            <th>Earnings</th>
                            <th>Amount</th>
                            <th>Deductions</th>
                            <th>Amount</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- Basic Pay -->
                        <tr>
                            <td>Basic Pay</td>
                            <td><input type="number" name="basicPay" class="form-control editable-input" th:value="${payroll.basicPay}" readonly></td>
                            <td>-</td>
                            <td>-</td>
                        </tr>

                        <!-- Dynamic Earnings -->
                        <tr th:each="earning : ${earningFields}">
                            <td th:text="${earning.name}"></td>
                            <td>
                                <input type="number"
                                       th:name="${'earning_' + earning.id}"
                                       class="form-control editable-input"
                                       th:value="${0}"
                                       disabled>
                            </td>
                            <td>-</td>
                            <td>-</td>
                        </tr>

                        <!-- Dynamic Deductions -->
                        <tr th:each="deduction : ${deductionFields}">
                            <td>-</td>
                            <td>-</td>
                            <td th:text="${deduction.name}"></td>
                            <td>
                                <input type="number"
                                       th:name="${'deduction_' + deduction.id}"
                                       class="form-control editable-input"
                                       th:value="${0}"
                                       disabled>
                            </td>
                        </tr>

                        <!-- Totals -->
                        <tr class="fw-bold">
                            <td>Gross Pay</td>
                            <td><input type="number" name="subtotal" class="form-control" readonly></td>
                            <td>Total Deductions</td>
                            <td><input type="number" name="totalDeductions" class="form-control" readonly></td>
                        </tr>
                        <tr class="fw-bold table-success">
                            <td colspan="2">Net Pay</td>
                            <td colspan="2"><input type="number" name="netPay" class="form-control" readonly></td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <button type="submit"
                        class="btn btn-success"
                        th:text="${session.role == 'SUPER_ADMIN'} ? 'Approve' : 'Generate'">
                    <i th:class="${session.role == 'SUPER_ADMIN'} ? 'bi bi-check-circle' : 'bi bi-save'"></i>
                </button>

                <input type="hidden" name="payPeriodId" th:value="${currentPayPeriod.id}" />
            </form>


        </main>
    </div>
</div>
</body>
</html>
